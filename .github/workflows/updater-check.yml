name: Check updater

# Manual only: runs when you press Run workflow. It no longer starts by itself on a push, because Mac runners use 10x the free
# Actions minutes and pushing many tags or commits once used the whole month's allowance.

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node test/updater.mac.smoke.js
