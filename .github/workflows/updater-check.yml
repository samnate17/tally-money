name: Check updater

on:
  workflow_dispatch:
  push:
    paths: ['updater.js', 'test/updater.mac.smoke.js', '.github/workflows/updater-check.yml']

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node test/updater.mac.smoke.js
