name: Build Mac app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag (e.g. v1.0.0). If set, publishes a GitHub Release with the build.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - name: Verify the native widget is embedded and the apps are validly signed
        run: |
          ls dist
          for app in dist/mac-arm64/*.app dist/mac/*.app; do
            echo "== $app"
            test -d "$app/Contents/PlugIns/TallyWidget.appex" || { echo "widget missing in $app"; exit 1; }
            codesign --verify --strict "$app"
            codesign --verify --strict "$app/Contents/PlugIns/TallyWidget.appex"
            test -f "$app/Contents/Resources/glass.node" || { echo "glass.node missing in $app"; exit 1; }
            codesign --verify --strict "$app/Contents/Resources/glass.node"
            codesign -d --entitlements - "$app/Contents/PlugIns/TallyWidget.appex" 2>&1 | grep -c "app-sandbox"
            file "$app/Contents/PlugIns/TallyWidget.appex/Contents/MacOS/TallyWidget"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tally-money-mac
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
