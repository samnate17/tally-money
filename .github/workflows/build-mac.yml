name: Build Mac app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag (e.g. v1.0.0). If set, publishes a GitHub Release with the build.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: tally-money-mac
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
