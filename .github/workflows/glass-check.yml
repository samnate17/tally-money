name: Check native glass

# Manual only: runs when you press Run workflow. It no longer starts by itself on a push, because Mac runners use 10x the free
# Actions minutes and pushing many tags or commits once used the whole month's allowance.

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Compile for both architectures
        run: |
          native-glass/build.sh arm64 out/arm64
          native-glass/build.sh x86_64 out/x86_64
          file out/arm64/glass.node out/x86_64/glass.node
      - name: Run it in Electron (this runner's macOS version decides whether glass exists)
        run: |
          sw_vers
          node node_modules/electron/install.js
          node_modules/.bin/electron --version
          node_modules/.bin/electron test/glass.smoke.js out/arm64/glass.node 2>&1 | tee run.log
          grep GLASS run.log

  macos26:
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: native-glass/build.sh arm64 out/arm64
      - name: Add real glass to a window on macOS 26
        run: |
          sw_vers
          node node_modules/electron/install.js
          node_modules/.bin/electron --version
          node_modules/.bin/electron test/glass.smoke.js out/arm64/glass.node 2>&1 | tee run.log
          grep GLASS run.log
          grep -q '"supported":true' run.log
          grep -q '"ok":true' run.log
