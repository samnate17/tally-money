<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tally widget</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root{--bg:rgba(255,255,255,.94);--ink:#141b34;--muted:#5d6682;--line:#dde2ee;--accent:#3b4cf0;--good:#0b8f63;--bad:#d3302f;--warn:#b86a00;--track:#e6e9ff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:rgba(23,28,51,.94);--ink:#eef0fa;--muted:#98a1c4;--line:#2b3254;--accent:#7c8bff;--good:#3fd09c;--bad:#ff7a76;--warn:#f0b04c;--track:#252d5c}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
.card{height:100%;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:12px 14px 12px;display:flex;flex-direction:column;gap:9px;-webkit-app-region:drag;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between}
.top b{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.btns{display:flex;gap:2px;-webkit-app-region:no-drag}
.btns button{border:0;background:none;color:var(--muted);width:26px;height:24px;border-radius:7px;font-size:14px;cursor:pointer}
.btns button:hover{background:var(--track);color:var(--ink)}
.btns button[aria-pressed=true]{color:var(--accent)}
.big2{font-size:20px;font-weight:700;letter-spacing:-.02em}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--muted);font-size:12px}
.bar{height:7px;border-radius:5px;background:var(--track);overflow:hidden;margin:5px 0 3px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.sec{border-top:1px solid var(--line);padding-top:8px}
.sec h3{margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:8px}
.row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bad{color:var(--bad)}.good{color:var(--good)}
.hide .amt{filter:blur(6px)}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px;animation:pl 1.8s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(63,208,156,.55)}50%{box-shadow:0 0 0 5px rgba(63,208,156,0)}}
.gwrap{position:relative;margin:4px 0 2px;height:auto}.gwrap svg{display:block;overflow:visible}
.spark .sline{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:100;stroke-dashoffset:0;animation:sdraw 1.1s ease-out}
.spark.still .sline,.spark.still .sfill{animation:none}
.spark .sfill{opacity:.16;animation:sfade 1.4s ease-out}
.spark.up .sline{stroke:var(--good)}.spark.up .sfill{fill:var(--good)}.spark.down .sline{stroke:var(--bad)}.spark.down .sfill{fill:var(--bad)}
.sdot{position:absolute;width:8px;height:8px;border-radius:50%}.sdot.up{background:var(--good)}.sdot.down{background:var(--bad)}
@keyframes sdraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@keyframes sfade{from{opacity:0}to{opacity:.16}}
.ringrow{display:flex;gap:12px;align-items:center}.rtext{flex:1;min-width:0}.rtext .row{padding:1px 0}
.ringw{position:relative;flex:0 0 auto}.ringw svg{display:block}
.rtrack{fill:none;stroke:var(--track);stroke-width:6}.rfill{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.rfill.warn{stroke:var(--warn)}.rfill.bad{stroke:var(--bad)}.rfill.good2{stroke:var(--good)}
.rmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}.rmid b{font-size:13px}.rmid span{font-size:9px;color:var(--muted)}
.mv{display:grid;grid-template-columns:44px 1fr 56px;gap:6px;align-items:center;font-size:12px;padding:1px 0}.mv span:last-child{text-align:right}
.mvbar{position:relative;height:7px;border-radius:5px;background:var(--track)}.mvbar::before{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:var(--line)}.mvbar i{position:absolute;top:0;bottom:0;border-radius:5px}.mvbar i.up{background:var(--good)}.mvbar i.down{background:var(--bad)}
.bdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px}.bdot.warn{background:var(--warn)}.bdot.bad{background:var(--bad)}
.leg{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11px;color:var(--muted);margin-top:4px}.leg i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px}
.scale{position:relative;height:8px;border-radius:5px;margin:6px 0 3px;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good))}.scale i{position:absolute;top:-3px;width:10px;height:14px;border-radius:5px;background:var(--ink);border:2px solid var(--bg)}
.dl{font-size:12px}
.hide .hide-on-blur{filter:blur(7px)}

.empty{color:var(--muted);text-align:center;margin:auto;padding:20px 6px}
a{color:var(--accent);cursor:pointer;-webkit-app-region:no-drag}
.body{display:flex;flex-direction:column;gap:9px;cursor:default;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-app-region:no-drag;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
</style></head>
<body><div class="card" id="card">
<div class="top"><b id="ttl">Tally</b><div class="btns">
<button id="eye" title="Hide amounts" aria-label="Hide amounts" aria-pressed="false">◐</button>
<button id="pin" title="Keep on top" aria-label="Keep on top" aria-pressed="false">⌃</button>
<button id="open" title="Open Tally" aria-label="Open Tally">↗</button>
<button id="x" title="Close widget" aria-label="Close widget">×</button></div></div>
<div class="body" id="body"><div class="empty">Open Tally once to fill this in.</div></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function m0(n){var a=Math.abs(Math.round(n)).toLocaleString('en-US');return (n<0?'-':'')+'$'+a}
var KEYS={},COLS=['var(--accent)','#16a085','#e8833a','#c2399a','#2e9fd8','#8a63d2'];
function pc(x){return (x>0?'+':'')+x.toFixed(2)+'%'}
// A little line graph with a soft fill and a dot on the latest value. It only animates when its numbers changed.
function spark(vals,w,h,cls,id){
  vals=(vals||[]).filter(function(v){return typeof v==='number'});
  if(vals.length<2)return '';
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),sp=Math.max(hi-lo,1e-9),pad=3,n=vals.length-1,pts=vals.map(function(v,i){return [pad+(w-2*pad)*i/n,pad+(h-2*pad)*(1-(v-lo)/sp)]});
  var line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' '),last=pts[pts.length-1],key=vals.join(','),still=KEYS[id]===key?' still':'';KEYS[id]=key;
  return '<svg class="spark '+cls+still+'" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" aria-hidden="true"><polygon class="sfill" points="'+pad+','+h+' '+line+' '+(w-pad)+','+h+'"/><polyline class="sline" pathLength="100" points="'+line+'"/></svg><span class="sdot '+cls+'" style="left:calc('+(last[0]/w*100).toFixed(1)+'% - 4px);top:'+(last[1]-4).toFixed(1)+'px"></span>';
}
// A ring that fills to a percentage, with text in the middle.
function ring(pct,size,cls,mid,sub){
  var r=(size-8)/2,c=2*Math.PI*r,p=Math.max(0,Math.min(100,pct)),off=c*(1-p/100);
  return '<div class="ringw" style="width:'+size+'px;height:'+size+'px"><svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'"><circle class="rtrack" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'"/><circle class="rfill '+cls+'" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg><div class="rmid"><b class="amt">'+mid+'</b>'+(sub?'<span>'+sub+'</span>':'')+'</div></div>';
}
function donut(cats,size){
  var tot=cats.reduce(function(n,c){return n+c.amt},0);if(!(tot>0))return '';
  var r=(size-14)/2,C=2*Math.PI*r,acc=0,segs=cats.map(function(c,i){var len=c.amt/tot*C,o='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+COLS[i%6]+'" stroke-width="12" stroke-dasharray="'+Math.max(0,len-1.5).toFixed(1)+' '+C.toFixed(1)+'" stroke-dashoffset="'+(-acc).toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>';acc+=len;return o}).join('');
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" aria-hidden="true">'+segs+'</svg>';
}
var lastD=null;
function draw(d){
  lastD=d;var s=d&&d.summary;
  $('card').className='card'+(d&&d.hideAmounts?' hide':'');
  if(s&&s.accent)document.documentElement.style.setProperty('--accent',s.accent);
  $('eye').setAttribute('aria-pressed',d&&d.hideAmounts?'true':'false');
  $('eye').title=d&&d.hideAmounts?(d.askAuth?'Show amounts (asks for Touch ID)':'Show amounts'):'Hide amounts';
  $('pin').setAttribute('aria-pressed',d&&d.onTop?'true':'false');
  if(!s){$('body').innerHTML='<div class="empty">Open Tally once to fill this in.</div>';return}
  var age=d&&d.at?Math.round((Date.now()-d.at)/60000):null,live=age!==null&&age<=5;
  $('ttl').innerHTML=(live?'<i class="pulse" title="Updated '+(age<1?'just now':age+' min ago')+'"></i>':'')+esc(s.sample?'Tally · example data':'Tally · '+s.month);
  var sp=s.spend,S={};
  S.networth=function(){
    if(!s.net)return '';
    var sk=s.net.spark||[],dl=sk.length>1?sk[sk.length-1]-sk[0]:null;
    return '<div class="sec first"><div class="sub">Net worth</div><div class="row"><span class="big amt '+(s.net.net<0?'bad':'')+'">'+m0(s.net.net)+'</span>'+(dl!==null?'<span class="amt '+(dl>=0?'good':'bad')+' dl">'+(dl>=0?'▲ ':'▼ ')+m0(Math.abs(dl))+'</span>':'')+'</div><div class="gwrap hide-on-blur">'+spark(sk,260,46,sk.length>1&&sk[sk.length-1]>=sk[0]?'up':'down','nw')+'</div><div class="sub amt">'+m0(s.net.assets)+' assets · '+m0(s.net.debts)+' debts</div></div>';
  };
  S.invest=function(){
    var v=s.invest;if(!v)return '';
    var up=v.dayChg>=0,cls=up?'good':'bad',mx=Math.max.apply(null,v.top.map(function(t){return Math.abs(t.pct)}).concat([0.01])),sk=v.spark||[],tr=sk.length>1&&sk[sk.length-1]>=sk[0]?'up':'down';
    return '<div class="sec"><h3>Investments</h3><div class="row"><span class="big2 amt">'+m0(v.value)+'</span><span class="'+cls+' amt">'+(up?'▲ ':'▼ ')+m0(Math.abs(v.dayChg))+(v.dayPct===null?'':' ('+pc(v.dayPct)+')')+'</span></div>'+
      '<div class="gwrap hide-on-blur">'+spark(sk,260,40,tr,'inv')+'</div><div class="sub amt">'+(v.gain>=0?'Up ':'Down ')+m0(Math.abs(v.gain))+(v.gainPct===null?'':' ('+pc(v.gainPct)+')')+' overall</div>'+
      v.top.map(function(t){var w=Math.max(4,Math.abs(t.pct)/mx*50);return '<div class="mv"><span>'+esc(t.sym)+'</span><span class="mvbar"><i class="'+(t.pct>=0?'up':'down')+'" style="width:'+w+'%;'+(t.pct>=0?'left:50%':'right:50%')+'"></i></span><span class="'+(t.pct>=0?'good':'bad')+'">'+pc(t.pct)+'</span></div>'}).join('')+'</div>';
  };
  S.budgets=function(){
    var h='';
    if(sp.budgeted>0){
      var p=sp.budgetSpent/sp.budgeted*100,cls=sp.budgetSpent>sp.budgeted?'bad':(p>85?'warn':'');
      h+='<div class="sec"><h3>Budgets</h3><div class="ringrow">'+ring(p,64,cls,Math.round(p)+'%','used')+'<div class="rtext"><div class="amt">'+m0(sp.budgetSpent)+' of '+m0(sp.budgeted)+'</div><div class="'+(sp.left<0?'bad':'good')+' amt">'+(sp.left<0?m0(-sp.left)+' over':m0(sp.left)+' left')+'</div>'+(sp.left>0&&s.daysLeft>0?'<div class="sub amt">About '+m0(sp.perDay)+' a day for '+s.daysLeft+' more days</div>':'')+'</div></div></div>';
    }else h+=S.spending();
    if(s.over.length)h+='<div class="sec"><h3>Over budget</h3>'+s.over.map(function(o){var w=Math.min(100,o.spent/Math.max(o.budget,1)*100);return '<div class="row"><span>'+esc(o.cat)+'</span><span class="bad amt">'+m0(o.spent-o.budget)+' over</span></div><div class="bar"><i class="bad" style="width:'+w+'%"></i></div>'}).join('')+'</div>';
    return h;
  };
  S.spending=function(){
    var cats=sp.cats||[],left=sp.income-sp.spent;
    return '<div class="sec"><h3>This month</h3><div class="ringrow">'+(cats.length?'<div class="dn hide-on-blur">'+donut(cats,72)+'</div>':'')+'<div class="rtext"><div class="row"><span>Income</span><span class="amt">'+m0(sp.income)+'</span></div><div class="row"><span>Spent</span><span class="amt">'+m0(sp.spent)+'</span></div><div class="row"><span>Left over</span><span class="amt '+(left<0?'bad':'good')+'">'+m0(left)+'</span></div></div></div>'+
      (cats.length?'<div class="leg hide-on-blur">'+cats.slice(0,4).map(function(c,i){return '<span><i style="background:'+COLS[i%6]+'"></i>'+esc(c.cat)+'</span>'}).join('')+'</div>':'')+'</div>';
  };
  S.bills=function(){return s.bills.length?'<div class="sec"><h3>Due soon</h3>'+s.bills.map(function(b){var c=b.days<=1?'bad':b.days<=3?'warn':'';return '<div class="row"><span><i class="bdot '+c+'"></i>'+esc(b.name)+' <span class="sub">'+(b.days<=0?'today':b.days===1?'tomorrow':'in '+b.days+' days')+'</span></span><span class="amt">'+m0(b.amount)+'</span></div>'}).join('')+'</div>':'<div class="sec"><h3>Due soon</h3><div class="sub">Nothing due in the next 7 days.</div></div>'};
  S.paycheck=function(){
    var v=s.pay;if(!v)return '';
    var cyc=v.cycle>0?v.cycle:14,pct=Math.max(0,Math.min(100,(1-Math.max(0,v.days)/cyc)*100));
    return '<div class="sec"><h3>Next paycheck</h3><div class="ringrow">'+ring(pct,56,'good2',v.days<=0?'Today':v.days+'d','')+'<div class="rtext"><div class="good amt big2">'+m0(v.net)+'</div><div class="sub">'+(v.days<=0?'Today':v.days===1?'Tomorrow':'In '+v.days+' days')+(v.job?' · '+esc(v.job):'')+'</div></div></div></div>';
  };
  S.goal=function(){return s.goal?'<div class="sec"><h3>Goal</h3><div class="ringrow">'+ring(s.goal.pct,56,'',s.goal.pct+'%','')+'<div class="rtext"><b>'+esc(s.goal.name)+'</b><div class="sub">of the way there</div></div></div></div>':''};
  S.debts=function(){var v=s.debt;return v?'<div class="sec"><h3>Debts</h3><div class="row"><span>You owe</span><span class="amt">'+m0(v.total)+'</span></div>'+(v.monthly>0?'<div class="row"><span>Monthly payments</span><span class="amt">'+m0(v.monthly)+'</span></div>':'')+'</div>':''};
  S.subs=function(){var v=s.subs;return v?'<div class="sec"><h3>Subscriptions</h3><div class="row"><span>'+v.count+' active</span><span class="amt">'+m0(v.monthly)+'/mo</span></div></div>':''};
  S.credit=function(){
    var v=s.credit;if(!(v&&v.score))return '';
    var pos=Math.max(0,Math.min(100,(v.score-300)/550*100));
    return '<div class="sec"><h3>Credit score</h3><div class="row"><span class="big2">'+v.score+'</span><span class="'+(v.diff>0?'good':v.diff<0?'bad':'sub')+'">'+(v.diff===null?'':v.diff>0?'▲ +'+v.diff:v.diff<0?'▼ '+v.diff:'no change')+'</span></div><div class="scale"><i style="left:calc('+pos.toFixed(1)+'% - 5px)"></i></div><div class="row sub"><span>300</span><span>850</span></div></div>';
  };
  var order=(d&&d.sections&&d.sections.length?d.sections:['networth','invest','budgets','bills','goal']),h='';
  order.forEach(function(id){if(S[id])h+=S[id]()});
  if(!h)h='<div class="empty">Nothing to show yet. Pick what to show in Tally: Settings, Desktop widget.</div>';
  var y=$('body').scrollTop;$('body').innerHTML=h;$('body').scrollTop=y;
}
widget.onData(draw);widget.get().then(draw);
setInterval(function(){if(lastD)draw(lastD)},60000);
$('eye').onclick=function(){widget.action('toggle-hide')};
$('pin').onclick=function(){widget.action('toggle-top')};
$('open').onclick=function(){widget.action('open')};
$('x').onclick=function(){widget.action('close')};
$('body').ondblclick=function(){widget.action('open')};
</script></body></html>
