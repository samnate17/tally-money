<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b4cf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Tally Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
/* Layout: left rail nav on desktop, bottom tab bar on phones; one content column of panels. */
:root{
  --bg:#eceff5; --surface:#ffffff; --surface2:#f4f6fb; --line:#dde2ee;
  --ink:#141b34; --muted:#5d6682; --accent:#3b4cf0; --accent-ink:#ffffff; --accent-soft:#e6e9ff;
  --good:#0b8f63; --warn:#b86a00; --bad:#d3302f; --good-soft:#dff5ec; --warn-soft:#fdf0d8; --bad-soft:#fde4e3;
  --c1:#3b4cf0; --c2:#16a085; --c3:#e8833a; --c4:#c2399a; --c5:#2e9fd8; --c6:#8a63d2; --c7:#d9a520; --c8:#7a8aa0;
  --font-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1222; --surface:#171c33; --surface2:#1e2440; --line:#2b3254;
  --ink:#eef0fa; --muted:#98a1c4; --accent:#7c8bff; --accent-ink:#0e1222; --accent-soft:#252d5c;
  --good:#3fd09c; --warn:#f0b04c; --bad:#ff7a76; --good-soft:#143a31; --warn-soft:#3d3015; --bad-soft:#442022;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1222; --surface:#171c33; --surface2:#1e2440; --line:#2b3254;
  --ink:#eef0fa; --muted:#98a1c4; --accent:#7c8bff; --accent-ink:#0e1222; --accent-soft:#252d5c;
  --good:#3fd09c; --warn:#f0b04c; --bad:#ff7a76; --good-soft:#143a31; --warn-soft:#3d3015; --bad-soft:#442022;
  color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:16px 96px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;display:flex;flex-direction:column;gap:4px;padding-top:8px}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;padding:4px 12px 16px;display:flex;align-items:center;gap:8px}
.brand svg{width:24px;height:24px;flex:none;border-radius:7px;box-shadow:0 0 12px rgba(59,76,240,.45)}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.nav:hover{background:var(--surface)}
.nav[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.nav svg{width:20px;height:20px;flex:none}
.railfoot{margin-top:16px;padding:0 12px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:8px}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:30px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{min-width:128px;text-align:center;font-family:var(--font-display)}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.gate .card{width:100%;max-width:420px;margin-top:6vh;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.gate h1{font-size:26px;margin:0 0 4px}
.gate label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.gate input[type=email],.gate input[type=password],.gate input[type=text]{width:100%}
.gate .err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:9px 12px;margin-top:12px;font-size:14px}
.gate .ack{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:13px;color:var(--muted)}
.gate .row2{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font:inherit;cursor:pointer;text-decoration:underline}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner span{min-width:0;flex:1 1 260px}
.grid{display:grid;gap:16px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.panel h2{font-size:17px;margin-bottom:12px}
.panel h2 small{font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tile .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:2px}
.tile .s{font-size:13px;color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#fff}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700}
.pill.good{background:var(--good-soft)} .pill.warn{background:var(--warn-soft)} .pill.bad{background:var(--bad-soft)} .pill.mute{background:var(--surface2);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--bad)} .bar>i.good{background:var(--good)}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:6px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend span.v{margin-left:auto}
svg text{fill:var(--muted);font-family:var(--font-body)}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input,select{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0;max-width:100%}
input[type=number]{width:110px}
.search{flex:1 1 180px}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tabbar{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:30;max-width:90vw}
.amt{font-weight:700;white-space:nowrap}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
  .tabbar .nav{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;align-items:center;text-align:center}
  .tabbar .nav[aria-current="page"]{box-shadow:none;background:var(--accent-soft);color:var(--accent)}
  .top h1{font-size:25px}
  .hide-s{display:none}
}
.pdfpre{max-height:220px;overflow:auto;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;line-height:1.4;white-space:pre-wrap;word-break:break-word;margin:8px 0}
.maptable{border-collapse:collapse;font-size:12px}.maptable td,.maptable th{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;font-weight:400}.maptable select{font-size:12px;padding:3px 6px;min-width:112px}
.pdfscroll{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:2px 12px}
.pdfrow{gap:8px}.pdfrow input[type=text]{min-width:0}.pdfrow select{max-width:130px}
.balform{display:flex;gap:6px;align-items:center}
.balform input{width:120px}
.row.wrap{flex-wrap:wrap}
.tabbar{overflow-x:auto}.tabbar .nav{flex:1 0 auto;min-width:62px;font-size:10px}
.tabbar .nav span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s ease}}
</style>

</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
var BASECATS=['Housing','Groceries','Dining','Transport','Subscriptions','Shopping','Health','Entertainment'];
var CATS=BASECATS.concat(['Other','Income']);
var RULE_PRESETS={gas:['shell','chevron','exxon','mobil','bp','arco','valero','sunoco','speedway','texaco','marathon','citgo','fuel','gas station','costco gas','wawa','sheetz','circle k','pilot','caseys']};
function syncCats(){var custom=(S&&Array.isArray(S.customCats)?S.customCats:[]).map(function(c){return c.name});CATS.length=0;BASECATS.concat(custom,['Other','Income']).forEach(function(c){CATS.push(c)})}
function ruleRe(k){return new RegExp('(^|[^a-z0-9])'+String(k).toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z0-9])','i')}
function ruleCat(n){var cc=(S&&S.customCats)||[];for(var i=0;i<cc.length;i++)for(var j=0;j<cc[i].rules.length;j++)if(ruleRe(cc[i].rules[j]).test(n))return cc[i].name;return null}
var CCOL={Housing:'--c1',Groceries:'--c2',Dining:'--c3',Transport:'--c5',Subscriptions:'--c6',Shopping:'--c4',Health:'--c7',Entertainment:'--c8',Other:'--c8',Income:'--good'};
var KEYWORDS=[['Subscriptions',/netflix|spotify|hulu|disney|icloud|adobe|youtube|prime|apple\.com|dropbox|patreon|audible|gym|fitness|membership/i],
 ['Groceries',/grocer|whole foods|trader joe|kroger|safeway|aldi|costco|walmart|market|publix/i],
 ['Dining',/restaurant|cafe|coffee|starbucks|chipotle|mcdonald|pizza|doordash|uber eats|grubhub|bar & grill|taco|sushi/i],
 ['Transport',/uber|lyft|shell|chevron|exxon|gas|fuel|transit|metro|parking|toll/i],
 ['Housing',/rent|mortgage|landlord|hoa|electric|water bill|internet|comcast|xfinity|utility/i],
 ['Health',/pharmacy|cvs|walgreens|clinic|dental|doctor|insurance/i],
 ['Entertainment',/cinema|theater|steam|playstation|xbox|ticket|concert/i],
 ['Shopping',/amazon|target|best buy|ikea|etsy|ebay|nike|zara|h&m/i],
 ['Income',/payroll|salary|direct dep|paycheck|deposit from|refund/i]];
function guessCat(n){var rc=ruleCat(n);if(rc)return rc;for(var i=0;i<KEYWORDS.length;i++)if(KEYWORDS[i][1].test(n))return KEYWORDS[i][0];return 'Other'}
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var fmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
var fmt0=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
function money(n){return fmt.format(n)}
function money0(n){return fmt0.format(n)}
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayDiff(a,b){return Math.round((b-a)/864e5)}
function monthKey(s){return s.slice(0,7)}
function monthLabel(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}
function shiftMonth(k,n){var p=k.split('-');var d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function shortDate(s){return parseD(s).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function uid(){return Math.random().toString(36).slice(2,9)}
function col(c){if(CCOL[c])return 'var('+CCOL[c]+')';var h=0,i;for(i=0;i<c.length;i++)h=(h*31+c.charCodeAt(i))>>>0;return 'var(--c'+(1+h%8)+')'}
var TODAY=new Date(); TODAY.setHours(0,0,0,0);
var NOWKEY=monthKey(iso(TODAY));
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2600)}

/* ---------- sample data ---------- */
function rng(seed){return function(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}}
function sample(){
  var r=rng(42),tx=[],i;
  function add(d,name,amt,cat){tx.push({id:uid(),date:iso(d),name:name,amount:amt,cat:cat})}
  for(var m=3;m>=0;m--){
    var base=new Date(TODAY.getFullYear(),TODAY.getMonth()-m,1);
    function on(day){var d=new Date(base.getFullYear(),base.getMonth(),day);return d}
    var subs=[['Netflix',-15.49,3],['Spotify',-11.99,7],['Planet Fitness',-49,9],['iCloud+',-2.99,12],['Hulu',-17.99,15],['Adobe Creative Cloud',-22.99,18]];
    subs.forEach(function(s){var d=on(s[2]);if(d<=TODAY)add(d,s[0],s[1],'Subscriptions')});
    if(on(1)<=TODAY)add(on(1),'Maple Court Rent',-1450,'Housing');
    if(on(5)<=TODAY)add(on(5),'Comcast Internet',-69.99,'Housing');
    if(on(1)<=TODAY)add(on(1),'Acme Corp Payroll',2400,'Income');
    if(on(15)<=TODAY)add(on(15),'Acme Corp Payroll',2400,'Income');
    var groc=['Whole Foods','Trader Joe\'s','Kroger'],din=['Chipotle','Blue Bottle Coffee','Sushi Den','DoorDash','Joe\'s Pizza'],tr=['Shell Gas','Uber','Metro Transit'],sh=['Amazon','Target','Best Buy'],he=['CVS Pharmacy','Dental Care'],en=['AMC Cinema','Steam'];
    function spree(list,n,lo,hi,cat){for(var k=0;k<n;k++){var day=1+Math.floor(r()*27);var d=on(day);if(d<=TODAY)add(d,list[Math.floor(r()*list.length)],-Math.round((lo+r()*(hi-lo))*100)/100,cat)}}
    spree(groc,7,38,130,'Groceries');spree(din,11,9,64,'Dining');spree(tr,6,14,58,'Transport');spree(sh,4,18,140,'Shopping');spree(he,1,20,90,'Health');spree(en,2,12,40,'Entertainment');
  }
  tx.sort(function(a,b){return a.date<b.date?1:-1});
  function nd(day){var d=new Date(TODAY.getFullYear(),TODAY.getMonth(),day);if(d<TODAY)d=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,day);return iso(d)}
  tx.forEach(function(x){if(/shell/i.test(x.name))x.cat='Gas'});
  return {sample:true,customCats:[{name:'Gas',rules:RULE_PRESETS.gas.slice()}],accounts:sampleAccounts(),extraPay:100,txns:tx,
   subs:[{id:uid(),name:'Netflix',amount:15.49,cycle:'monthly',next:nd(3),status:'active'},
         {id:uid(),name:'Spotify',amount:11.99,cycle:'monthly',next:nd(7),status:'active'},
         {id:uid(),name:'Planet Fitness',amount:49,cycle:'monthly',next:nd(9),status:'flagged'},
         {id:uid(),name:'iCloud+',amount:2.99,cycle:'monthly',next:nd(12),status:'active'},
         {id:uid(),name:'Hulu',amount:17.99,cycle:'monthly',next:nd(15),status:'active'}],
   budgets:{Groceries:450,Dining:300,Transport:100,Gas:120,Shopping:200,Entertainment:80,Health:100,Subscriptions:130},
   goals:[{id:uid(),name:'Emergency fund',target:6000,saved:2150},{id:uid(),name:'Japan trip',target:3500,saved:900}]};
}
var S,month=NOWKEY,view='overview',filter={q:'',cat:''},editBudgets=false;
function load(){try{var j=localStorage.getItem('tally-money-v1');if(j){S=JSON.parse(j);migrate();syncCats();return}}catch(e){}S=sample();migrate();syncCats()}
function defCredit(){return {scores:[],profile:{late:'unknown',inq:'unknown',oldest:'',derog:'unknown'}}}
function migrate(){if(!Array.isArray(S.customCats))S.customCats=[];if(!Array.isArray(S.holdings))S.holdings=S.sample?sampleHoldings():[];if(!S.credit||!Array.isArray(S.credit.scores))S.credit=S.sample?sampleCredit():defCredit();if(!Array.isArray(S.plaidIgnored))S.plaidIgnored=[];if(!Array.isArray(S.accounts))S.accounts=S.sample?sampleAccounts():[];if(typeof S.extraPay!=='number')S.extraPay=S.sample?100:0}
function save(){try{localStorage.setItem('tally-money-v1',JSON.stringify(S))}catch(e){}if(HOSTED)schedulePush();widgetPush()}

/* ---------- derived ---------- */
function spendBy(mk){var o={},t=0;S.txns.forEach(function(x){if(monthKey(x.date)===mk&&x.cat!=='Income'&&x.amount<0){o[x.cat]=(o[x.cat]||0)-x.amount;t-=x.amount}});return {by:o,total:t}}
function incomeOf(mk){var t=0;S.txns.forEach(function(x){if(monthKey(x.date)===mk&&x.amount>0)t+=x.amount});return t}
function perMonth(s){return s.cycle==='yearly'?s.amount/12:s.amount}
function nextDate(s){var d=parseD(s.next),n=0;while(d<TODAY&&n<500){d=s.cycle==='yearly'?new Date(d.getFullYear()+1,d.getMonth(),d.getDate()):new Date(d.getFullYear(),d.getMonth()+1,d.getDate());n++}return d}
function activeSubs(){return S.subs.filter(function(s){return s.status!=='cancelled'})}
function normName(n){return n.toLowerCase().replace(/[#\d*]+/g,'').replace(/\s+/g,' ').trim()}
function detect(){
  var g={};
  S.txns.forEach(function(x){if(x.amount<0&&x.cat!=='Housing'&&x.cat!=='Income'){var k=normName(x.name);(g[k]=g[k]||[]).push(x)}});
  var known=S.subs.map(function(s){return normName(s.name)}),out=[];
  Object.keys(g).forEach(function(k){
    var a=g[k].slice().sort(function(p,q){return p.date<q.date?-1:1});
    if(a.length<2||known.indexOf(k)>-1)return;
    var amts=a.map(function(x){return -x.amount}),mn=Math.min.apply(null,amts),mx=Math.max.apply(null,amts);
    if(mx>mn*1.15)return;
    var gaps=[];for(var i=1;i<a.length;i++)gaps.push(dayDiff(parseD(a[i-1].date),parseD(a[i].date)));
    gaps.sort(function(p,q){return p-q});var med=gaps[Math.floor(gaps.length/2)];
    var cycle=med>=26&&med<=35?'monthly':(med>=355&&med<=375?'yearly':null);
    if(!cycle)return;
    var last=a[a.length-1];
    var nx=cycle==='yearly'?new Date(parseD(last.date).getFullYear()+1,parseD(last.date).getMonth(),parseD(last.date).getDate()):new Date(parseD(last.date).getFullYear(),parseD(last.date).getMonth()+1,parseD(last.date).getDate());
    out.push({name:last.name,amount:amts[amts.length-1],cycle:cycle,next:iso(nx),count:a.length});
  });
  return out;
}

function donut(by,total){
  var ents=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  if(!ents.length)return '<div class="empty">No spending recorded this month.</div>';
  var R=54,C=2*Math.PI*R,off=0,arcs='';
  ents.forEach(function(c){var len=by[c]/total*C;arcs+='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+col(c)+'" stroke-width="20" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';off+=len});
  var leg=ents.map(function(c){return '<div><span class="dot" style="background:'+col(c)+'"></span>'+c+'<span class="v num">'+money0(by[c])+'</span></div>'}).join('');
  return '<div class="donutwrap"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Spending by category">'+arcs+'<text x="70" y="66" text-anchor="middle" font-size="11">Spent</text><text x="70" y="86" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--ink);font-family:var(--font-display)">'+money0(total)+'</text></svg><div class="legend">'+leg+'</div></div>';
}
function trend(){

  var mx=Math.max.apply(null,sp.concat(inc).concat([1])),W=420,H=170,pl=6,bw=22,g=(W-pl*2)/6,out='';
  var step=mx>4000?1000:mx>1500?500:250,top=Math.ceil(mx/step)*step;
  for(var t=0;t<=top;t+=step){var y=H-24-(t/top)*(H-44);out+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/>'+'<text x="0" y="'+(y-3)+'" font-size="10">'+(t?money0(t):'')+'</text>'}
  ks.forEach(function(k,i){
    var x=pl+i*g+g/2,hs=(sp[i]/top)*(H-44),hi=(inc[i]/top)*(H-44);
    out+='<rect x="'+(x-bw-1)+'" y="'+(H-24-hi)+'" width="'+bw+'" height="'+hi+'" rx="4" fill="var(--good)" opacity=".55"/>';

    out+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" '+(k===month?'style="fill:var(--ink);font-weight:700"':'')+'>'+new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleDateString('en-US',{month:'short'})+'</text>';
  });

}

var budSel='',budDel='';
function moveByRules(name){
  var cc=S.customCats.filter(function(c){return c.name===name})[0],n=0,mine={};if(!cc)return 0;
  S.customCats.forEach(function(c){mine[c.name]=1});
  S.txns.forEach(function(x){
    if(x.amount>=0||x.cat===name||mine[x.cat])return;
    if(cc.rules.some(function(r){return ruleRe(r).test(x.name)})){x.cat=name;n++}
  });
  return n;
}
function barChart(vals,labels,o){

  if(o.cur!==undefined){var x=pl+step*n+(step-bw)/2,top=Math.max(o.cur,0);out+='<rect x="'+x+'" y="'+Y(top)+'" width="'+bw+'" height="'+(H-pb-Y(top))+'" rx="4" fill="var(--accent)" opacity=".35"/>'+(o.proj?'<rect x="'+x+'" y="'+Y(o.proj)+'" width="'+bw+'" height="'+(H-pb-Y(o.proj))+'" rx="4" fill="none" stroke="var(--accent)" stroke-dasharray="3 3"/>':'')+'<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" style="fill:var(--ink);font-weight:700">Now</text>'}
  if(o.avg)out+='<line x1="0" x2="'+W+'" y1="'+Y(o.avg)+'" y2="'+Y(o.avg)+'" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="'+(W-4)+'" y="'+(Y(o.avg)-4)+'" text-anchor="end" font-size="10">average '+money0(o.avg)+'</text>';
  if(o.suggested)out+='<line x1="0" x2="'+W+'" y1="'+Y(o.suggested)+'" y2="'+Y(o.suggested)+'" stroke="var(--good)" stroke-width="2"/><text x="'+(W-4)+'" y="'+(Y(o.suggested)-4)+'" text-anchor="end" font-size="10" style="fill:var(--good);font-weight:700">suggested '+money0(o.suggested)+'</text>';
  if(o.budget&&o.budget!==o.suggested)out+='<line x1="0" x2="'+W+'" y1="'+Y(o.budget)+'" y2="'+Y(o.budget)+'" stroke="var(--warn)" stroke-dasharray="2 3"/><text x="4" y="'+(Y(o.budget)-4)+'" font-size="10" style="fill:var(--warn)">your budget '+money0(o.budget)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:640px" role="img" aria-label="'+esc(o.label||'Spending by month')+'">'+out+'</svg>';
}

function simulatePayoff(debts,extra,method){
  var ds=debts.filter(function(d){return d.balance>0}).map(function(d){return {id:d.id,name:d.name,bal:d.balance,apr:d.apr||0,min:d.minPay||0,paid:0}});
  if(!ds.length)return {ok:true,months:0,interest:0,order:[]};
  var budget=ds.reduce(function(a,d){return a+d.min},0)+(extra||0);
  if(!(budget>0))return {ok:false,reason:'nopay'};
  ds.sort(method==='snowball'?function(a,b){return a.bal-b.bal}:function(a,b){return b.apr-a.apr||a.bal-b.bal});
  var m=0,interest=0;
  function open(){return ds.some(function(d){return d.bal>0.005})}
  while(open()&&m<1200){
    m++;
    ds.forEach(function(d){if(d.bal>0.005){var i=d.bal*d.apr/1200;d.bal+=i;interest+=i}});
    var avail=budget;
    ds.forEach(function(d){if(d.bal>0.005){var p=Math.min(d.min,d.bal,avail);d.bal-=p;avail-=p}});
    ds.forEach(function(d){if(d.bal>0.005&&avail>0){var p=Math.min(d.bal,avail);d.bal-=p;avail-=p}});
    ds.forEach(function(d){if(d.bal<=0.005&&!d.paid)d.paid=m});
  }
  if(open())return {ok:false,reason:'never'};
  return {ok:true,months:m,interest:interest,order:ds.slice().sort(function(a,b){return a.paid-b.paid})};
}

function addMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,1)}
function monthYear(d){return d.toLocaleDateString('en-US',{month:'short',year:'numeric'})}
function dur(m){var y=Math.floor(m/12),r=m%12;return (y?y+' yr':'')+(y&&r?' ':'')+((r||!y)?r+' mo':'')}
function balanceOn(a,cut){var v=null;a.history.forEach(function(h){if(h.date<=cut)v=h.balance});return v}
function nwSeries(){
  var first=null;S.accounts.forEach(function(a){a.history.forEach(function(h){if(!first||h.date<first)first=h.date})});
  if(!first)return [];
  var out=[],k=monthKey(first);
  while(k<=NOWKEY&&out.length<60){
    var cut=k===NOWKEY?iso(TODAY):iso(new Date(+k.slice(0,4),+k.slice(5),0)),v=0,any=false;
    S.accounts.forEach(function(a){var b=balanceOn(a,cut);if(b!==null){any=true;v+=isDebt(a)?-b:b}});
    if(any)out.push({k:k,v:v});
    k=shiftMonth(k,1);
  }
  return out.slice(-6);
}

/*LOGIC-START*/
function applySync(res,itemId){
  var out={newTx:0,updTx:0,delTx:0,newAcct:0,updAcct:0},tdy=iso(TODAY);
  if(!Array.isArray(S.plaidIgnored))S.plaidIgnored=[];
  (res.accounts||[]).forEach(function(a){
    if(S.plaidIgnored.indexOf(a.accountId)>-1)return;
    var ex=S.accounts.filter(function(x){return x.plaid&&x.plaid.accountId===a.accountId})[0];
    if(ex){
      ex.plaid.itemId=itemId;
      if(a.type==='credit'&&a.limit>0)ex.limit=a.limit;
      if(a.balance!==null&&a.balance!==ex.balance){
        ex.balance=a.balance;
        var h=ex.history.filter(function(x){return x.date===tdy})[0];
        if(h)h.balance=a.balance;else ex.history.push({date:tdy,balance:a.balance});
        ex.history.sort(function(p,q){return p.date<q.date?-1:1});out.updAcct++;
      }
    }else{
      var b=a.balance===null?0:a.balance;
      var na={id:uid(),name:a.name+(a.mask?' ••'+a.mask:''),type:a.type,balance:b,apr:0,minPay:0,history:[{date:tdy,balance:b}],plaid:{itemId:itemId,accountId:a.accountId}};if(a.type==='credit'&&a.limit>0)na.limit=a.limit;S.accounts.push(na);out.newAcct++;
    }
  });
  var byPid={};S.txns.forEach(function(x){if(x.plaidId)byPid[x.plaidId]=x});
  function category(t){
    if(t.amount>0)return /refund|return/i.test(t.name)?'Other':'Income';
    var g=guessCat(t.name);
    return g==='Subscriptions'?g:(t.catHint&&t.catHint!=='Income'?t.catHint:(g==='Income'?'Other':g));
  }
  function add(t){var x={id:uid(),plaidId:t.plaidId,date:t.date,name:t.name,amount:t.amount,cat:category(t)};S.txns.push(x);byPid[t.plaidId]=x}
  (res.added||[]).forEach(function(t){
    var ex=byPid[t.plaidId];
    if(ex){ex.date=t.date;ex.name=t.name;ex.amount=t.amount;out.updTx++}else{add(t);out.newTx++}
  });
  (res.modified||[]).forEach(function(t){
    var ex=byPid[t.plaidId];
    if(ex){ex.date=t.date;ex.name=t.name;ex.amount=t.amount;out.updTx++}else{add(t);out.newTx++}
  });
  var rm={};(res.removed||[]).forEach(function(id){rm[id]=1});
  var before=S.txns.length;
  S.txns=S.txns.filter(function(x){return !(x.plaidId&&rm[x.plaidId])});
  out.delTx=before-S.txns.length;
  S.txns.sort(function(a,b){return a.date<b.date?1:-1});
  return out;
}
function aiKey(n){return normName(n)||'(blank)'}
function maskName(n){return String(n).replace(/[0-9]{4,}/g,'#').slice(0,60)}
function buildAiPayload(){
  var cut=iso(addDays(TODAY,-365)),groups={},n=0,first='',last='';
  S.txns.forEach(function(x){
    if(x.date<cut)return;
    n++;if(!first||x.date<first)first=x.date;if(!last||x.date>last)last=x.date;
    var k=aiKey(x.name),g=groups[k]||(groups[k]={key:k,name:x.name,count:0,total:0,rows:[],ld:''});
    g.count++;g.total+=x.amount;g.rows.push([x.date,Math.round(x.amount*100)/100]);

var MONTHRE='(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?';

    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}

    else f+=c}

      if(surplus>0&&upfront<=surplus)add('good','This is less than one month of your usual leftover money ('+money0(surplus)+').');
      else add('warn','Without account balances this can’t be checked. It is '+(surplus>0?'more than a month of your usual leftover money ('+money0(surplus)+').':'bigger than your usual leftover money, which is '+m0(surplus)+' a month.'));
    }else{
      var avail=c.liquid-c.upcoming,after=avail-upfront,cover=c.avgSpend>0?after/c.avgSpend:null;
      st.liquid=c.liquid;st.after=after;st.cover=cover;
      var fm=function(v){return v>=12?'over a year of spending':v.toFixed(1)+' months of spending'};
      var base='You have '+money0(c.liquid)+' in checking, savings and cash'+(c.upcoming>0?', and about '+money0(c.upcoming)+' of subscriptions are due in the next 30 days':'')+'.';
      if(after<0)add('bad',base+' This costs '+money0(upfront)+', so you would be '+money0(-after)+' short.');
      else if(cover!==null&&cover<1)add('bad',base+' After paying '+money0(upfront)+' you would have '+money0(after)+' left, less than one month of spending.');
      else if(cover!==null&&cover<3)add('warn',base+' After paying '+money0(upfront)+' you would have '+money0(after)+', about '+fm(cover)+'. A 3-month cushion is a common target.');
      else add('good',base+' After paying '+money0(upfront)+' you would still have '+money0(after)+(cover!==null?', about '+fm(cover):'')+'.');
    }
  }
  if(monthly>0){
    st.newSurplus=newSurplus;
    if(c.avgIncome<=0)add('info','No income found in your recent transactions, so the monthly cost can’t be compared with what you earn.');
    else if(newSurplus<0)add('bad','You currently keep about '+m0(surplus)+' a month. Adding '+money0(monthly)+' a month would leave you '+money0(-newSurplus)+' short every month.');
    else if(newSurplus<0.1*c.avgIncome)add('warn','You currently keep about '+m0(surplus)+' a month. After '+money0(monthly)+' a month you would keep '+money0(newSurplus)+', under 10% of your income.');
    else add('good','You currently keep about '+m0(surplus)+' a month. After '+money0(monthly)+' a month you would still keep '+money0(newSurplus)+'.');
  }
  if(c.budgetLeft!==null){
    var cost=inp.type==='yearly'?upfront:amt;
    if(cost>c.budgetLeft)add('warn','This is more than the '+money0(Math.max(0,c.budgetLeft))+' left in your '+inp.cat+' budget this month.');
    else add('info','It fits in the '+money0(c.budgetLeft)+' left in your '+inp.cat+' budget this month.');
  }
  if(c.highDebt&&(upfront>=100||monthly>=20))add('warn','You owe '+money0(c.highDebt.total)+' at interest rates up to '+c.highDebt.maxApr+'%. Paying that down first is a guaranteed return at that rate, and this spending delays it.');
  var level='good',any=false;
  R.forEach(function(r){if(rank[r.k]!==undefined){any=true;if(rank[r.k]>rank[level])level=r.k}});
  if(!any)level='warn';
  var wait=null;
  if(upfront>0&&c.liquid!==null&&level!=='good'){
    var need=upfront+3*c.avgSpend+c.upcoming-c.liquid;
    if(need>0)wait=surplus>0?'At your usual '+money0(surplus)+' a month, you could pay for this and keep a 3-month cushion in about '+Math.ceil(need/surplus)+' month'+(Math.ceil(need/surplus)===1?'':'s')+'.':'You are not currently saving anything on average, so waiting won’t close the gap unless spending drops or income rises.';
  }
  var title=!any?'Not enough data to say':level==='good'?'Yes, you can afford this':level==='warn'?'You can, but it is tight':'Not right now';
  return {level:level,title:title,reasons:R,wait:wait,stats:st,surplus:surplus};
}

function plSyncIds(ids){

var credPay='';

  if(sc.length<2)return '';
  var W=420,H=130,pl=8,pr=8,pt=12,pb=22,vals=sc.map(function(p){return p.score}),mn=Math.min.apply(null,vals)-15,mx=Math.max.apply(null,vals)+15;
  function X(i){return pl+i*(W-pl-pr)/(sc.length-1)}function Y(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb)}
  var out='<line x1="0" x2="'+W+'" y1="'+Y(mn+15)+'" y2="'+Y(mn+15)+'" stroke="var(--line)"/><line x1="0" x2="'+W+'" y1="'+Y(mx-15)+'" y2="'+Y(mx-15)+'" stroke="var(--line)"/>';
  out+='<polyline points="'+sc.map(function(p,i){return X(i)+','+Y(p.score)}).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  sc.forEach(function(p,i){var last=i===sc.length-1;out+='<circle cx="'+X(i)+'" cy="'+Y(p.score)+'" r="'+(last?5:3)+'" fill="var(--accent)"/><text x="'+X(i)+'" y="'+(Y(p.score)-9)+'" text-anchor="'+(i===0?'start':last?'end':'middle')+'" font-size="11"'+(last?' style="fill:var(--ink);font-weight:700"':'')+'>'+p.score+'</text><text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="'+(i===0?'start':last?'end':'middle')+'" font-size="10">'+shortDate(p.date)+'</text>'});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:560px" role="img" aria-label="Credit score over time">'+out+'</svg>';
}

  m.querySelectorAll('.balform').forEach(function(fm){fm.onsubmit=function(e){e.preventDefault();var a=S.accounts.filter(function(x){return x.id===fm.dataset.id})[0],v=parseFloat(fm.querySelector('input').value);if(!a||!(v>=0))return;a.balance=v;var t=iso(TODAY),h=a.history.filter(function(x){return x.date===t})[0];if(h)h.balance=v;else a.history.push({date:t,balance:v});a.history.sort(function(p,q){return p.date<q.date?-1:1});save();render();toast(a.name+' updated.')}});

document.addEventListener('click',function(e){
  var v=e.target.closest('[data-view]');if(v){view=v.dataset.view;pendingImport=null;render();window.scrollTo(0,0);return}

  else if(a==='cat-apply'){var mv=moveByRules(b.dataset.c);toast(mv?'Moved '+mv+' past transaction'+(mv===1?'':'s')+' into '+b.dataset.c+'.':'No past transactions match those keywords.')}
  else if(a==='cat-del'){budDel=b.dataset.c}

  else if(a==='wg-vis'){widgetSet('visible',!(WS&&WS.visible));return}

/* ---------- Desktop widget (Mac app) ---------- */

function widgetSet(what,val){

/* ---------- Hosted accounts (web build only) ---------- */
var CRYPTO=window.crypto;
var HOSTED=false,AUTH={email:'',key:null,version:0,status:'',dirty:false,busy:false,conflict:null,t:0},gate=null,acctMode='',acctMsg='';
function api(method,path,body){
  return fetch(path,{method:method,credentials:'same-origin',headers:{'content-type':'application/json','x-tally':'1'},body:body===undefined?undefined:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return {ok:false,error:'Unexpected reply.'}}).then(function(j){j.status=r.status;return j})});
}
function wipeLocal(){try{['tally-money-v1','tally-plaid-v1','tally-quotes-v1','tally-owner'].forEach(function(k){localStorage.removeItem(k)})}catch(e){}}
function ownerGet(){try{return localStorage.getItem('tally-owner')||''}catch(e){return ''}}
function ownerSet(v){try{localStorage.setItem('tally-owner',v)}catch(e){}}
function adopt(obj){S=obj;migrate();syncCats();try{localStorage.setItem('tally-money-v1',JSON.stringify(S))}catch(e){}}
function showGate(mode,msg){gate={mode:mode,msg:msg||'',busy:false};drawGate()}
function drawGate(){
  var el=$('#gate');if(!gate){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='gate';el.className='gate';document.body.appendChild(el)}
  var g=gate,m=g.mode,h='<div class="card"><h1>Tally Money</h1>';
  var err=g.msg?'<div class="err" role="alert">'+esc(g.msg)+'</div>':'';
  if(m==='unlock'){
    h+='<p class="sub muted">Signed in as <b>'+esc(AUTH.email)+'</b>. Enter your password to unlock your data.</p><form id="gf" data-m="unlock"><label for="g-pw">Password</label><input id="g-pw" type="password" autocomplete="current-password" required autofocus>'+err+'<div class="row2"><button class="btn primary" type="submit"'+(g.busy?' disabled':'')+'>'+(g.busy?'Unlocking…':'Unlock')+'</button><button class="linkbtn" type="button" data-g="out">Sign out</button></div></form>';
  }else if(m==='register'){
    h+='<p class="sub muted">Creating an account needs an invite code from the person who runs this site.</p><form id="gf" data-m="register"><label for="g-em">Email</label><input id="g-em" type="email" autocomplete="username" required><label for="g-inv">Invite code</label><input id="g-inv" type="text" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX" required><label for="g-pw">Password (10+ characters)</label><input id="g-pw" type="password" autocomplete="new-password" required><label for="g-pw2">Repeat password</label><input id="g-pw2" type="password" autocomplete="new-password" required><label class="ack"><input id="g-ack" type="checkbox"><span>I understand that my data is encrypted with my password. If I forget it, nobody can recover it. I will download backups.</span></label>'+err+'<div class="row2"><button class="btn primary" type="submit"'+(g.busy?' disabled':'')+'>'+(g.busy?'Creating…':'Create account')+'</button><button class="linkbtn" type="button" data-g="signin">I already have an account</button></div></form>';
  }else{
    h+='<p class="sub muted">Sign in to open your data.</p><form id="gf" data-m="signin"><label for="g-em">Email</label><input id="g-em" type="email" autocomplete="username" required autofocus><label for="g-pw">Password</label><input id="g-pw" type="password" autocomplete="current-password" required>'+err+'<div class="row2"><button class="btn primary" type="submit"'+(g.busy?' disabled':'')+'>'+(g.busy?'Signing in…':'Sign in')+'</button><button class="linkbtn" type="button" data-g="register">Have an invite code?</button></div></form>';
  }
  el.innerHTML=h+'</div>';
  var f=$('#gf',el);if(f)f.onsubmit=function(e){e.preventDefault();gateSubmit(f.dataset.m)};
  el.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){var a=b.dataset.g;if(a==='out')signOut();else showGate(a)}});
  var first=$('input',el);if(first&&!g.busy)first.focus();
}
function gateFail(msg){gate.busy=false;gate.msg=msg;var v=function(id){var x=$(id);return x?x.value:''};var keep={em:v('#g-em'),inv:v('#g-inv'),ack:!!($('#g-ack')&&$('#g-ack').checked)};drawGate();if(keep.em&&$('#g-em'))$('#g-em').value=keep.em;if(keep.inv&&$('#g-inv'))$('#g-inv').value=keep.inv;if(keep.ack&&$('#g-ack'))$('#g-ack').checked=true}
function gateSubmit(mode){
  var em=mode==='unlock'?AUTH.email:($('#g-em').value||'').trim().toLowerCase(),pw=$('#g-pw').value;
  if(mode==='register'){
    var inv=$('#g-inv').value,bad=passwordProblem(pw,em);
    if(bad)return gateFail(bad);
    if(pw!==$('#g-pw2').value)return gateFail('The two passwords do not match.');
    if(!$('#g-ack').checked)return gateFail('Please tick the box to confirm you understand.');
  }
  gate.busy=true;gate.msg='';var eb=$('#gf button[type=submit]'),ee=$('#gate .err');if(eb){eb.disabled=true;eb.textContent='Working…'}if(ee)ee.remove();
  deriveKeys(em,pw).then(function(k){
    if(mode==='unlock')return afterAuth(em,k.key);
    var body=mode==='register'?{email:em,auth:k.auth,invite:inv}:{email:em,auth:k.auth};
    return api('POST',mode==='register'?'/api/register':'/api/login',body).then(function(r){
      if(!r.ok)return gateFail(r.error||'Something went wrong.');
      return afterAuth(r.email,k.key,mode==='register');
    });
  }).catch(function(er){gateFail(er&&er.message?er.message:'Something went wrong.')});
}
function afterAuth(email,key,isNew){
  AUTH.email=email;AUTH.key=key;
  return api('GET','/api/data').then(function(r){
    if(!r.ok){if(r.signedOut){AUTH.key=null;return showGate('signin','Your session ended. Please sign in again.')}return gateFail(r.error||'Could not load your data.')}
    AUTH.version=r.version;
    if(r.data){
      return openJson(key,r.data).then(function(obj){adopt(obj);ownerSet(email);finishGate()},function(er){AUTH.key=null;gateFail(er.message)});
    }
    // Nothing stored yet for this account.
    var own=ownerGet(),local=null;try{local=JSON.parse(localStorage.getItem('tally-money-v1')||'null')}catch(e){}
    if(local&&own===email){S=local;migrate();syncCats()}
    else if(local&&!own&&!local.sample&&window.confirm('This browser already has Tally data that was saved before accounts. Add it to your new account?\n\nOK adds it. Cancel starts the account empty.')){S=local;migrate();syncCats()}
    else{wipeLocal();S=sample();migrate();syncCats()}
    ownerSet(email);
    finishGate();AUTH.dirty=true;push();
  }).catch(function(er){gateFail(er&&er.message?er.message:'Could not reach the server.')});
}
function finishGate(){gate=null;drawGate();AUTH.status='Synced';render()}
function signOut(){api('POST','/api/logout',{}).then(function(){wipeLocal();location.reload()},function(){wipeLocal();location.reload()})}
var pushT=0;
function schedulePush(){if(!HOSTED||!AUTH.key)return;AUTH.dirty=true;AUTH.status='Saving…';clearTimeout(pushT);pushT=setTimeout(push,1500)}
function push(){
  if(!HOSTED||!AUTH.key||!AUTH.dirty||AUTH.busy||AUTH.conflict)return;
  AUTH.busy=true;AUTH.dirty=false;
  var snap=S;
  return sealJson(AUTH.key,snap).then(function(data){return api('PUT','/api/data',{baseVersion:AUTH.version,data:data})}).then(function(r){
    AUTH.busy=false;
    if(r.ok){AUTH.version=r.version;AUTH.status='Synced '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
    else if(r.conflict){AUTH.conflict=true;AUTH.status='Changed on another device'}
    else if(r.signedOut){AUTH.key=null;showGate('unlock','Your session ended. Enter your password to continue.')}
    else{AUTH.dirty=true;AUTH.status='Not saved: '+(r.error||'error')+'. Will retry.';clearTimeout(pushT);pushT=setTimeout(push,30000)}
    if(AUTH.dirty&&!AUTH.conflict&&r.ok)push();
    syncUi();
  },function(){AUTH.busy=false;AUTH.dirty=true;AUTH.status='Offline. Will retry.';clearTimeout(pushT);pushT=setTimeout(push,30000);syncUi()});
}
function syncUi(){var el=$('#syncstat');if(el)el.textContent=AUTH.status;var b=$('#conflict');if(b)b.hidden=!AUTH.conflict;else if(AUTH.conflict)render()}
function pullIfNewer(){
  if(!HOSTED||!AUTH.key||AUTH.busy)return;
  api('GET','/api/data').then(function(r){
    if(!r.ok||r.version<=AUTH.version||!r.data)return;
    if(AUTH.dirty||AUTH.conflict){AUTH.conflict=true;AUTH.remote=r;syncUi();return}
    openJson(AUTH.key,r.data).then(function(obj){AUTH.version=r.version;adopt(obj);AUTH.status='Updated from another device';render()},function(){});
  },function(){});
}
function resolveConflict(useRemote){
  api('GET','/api/data').then(function(r){
    if(!r.ok)return;
    if(useRemote&&r.data){openJson(AUTH.key,r.data).then(function(obj){AUTH.version=r.version;AUTH.conflict=false;AUTH.dirty=false;adopt(obj);AUTH.status='Loaded the other version';render()})}
    else{AUTH.version=r.version;AUTH.conflict=false;AUTH.dirty=true;push()}
  });
}
function accountPanel(){
  if(!HOSTED)return '';
  var f=acctMode==='pw'?'<form data-acct="pw" class="form" style="margin-top:12px;flex-wrap:wrap"><input id="ac-old" type="password" placeholder="Current password" autocomplete="current-password" required><input id="ac-new" type="password" placeholder="New password (10+)" autocomplete="new-password" required><input id="ac-new2" type="password" placeholder="Repeat new password" autocomplete="new-password" required><button class="btn primary">Change password</button><button class="btn" type="button" data-act="acct-cancel">Cancel</button></form>'
   :acctMode==='del'?'<form data-acct="del" class="form" style="margin-top:12px;flex-wrap:wrap"><input id="ac-old" type="password" placeholder="Password to confirm" autocomplete="current-password" required><button class="btn danger">Delete my account and data</button><button class="btn" type="button" data-act="acct-cancel">Cancel</button></form><p class="sub muted" style="font-size:13px">This permanently removes your account and everything stored for it. It cannot be undone.</p>':'';
  return '<section class="panel"><h2>Account<small>'+esc(AUTH.email)+'</small></h2><p class="sub muted" style="margin:0 0 10px;font-size:13px">Your data is encrypted in this browser before it is saved to your account, so the site owner cannot read it. If you forget your password it cannot be recovered, so keep a backup. <span id="syncstat">'+esc(AUTH.status)+'</span></p><div class="actions" style="justify-content:flex-start"><button class="btn" data-act="acct-pw">Change password</button><button class="btn" data-act="acct-out">Sign out</button><button class="btn danger" data-act="acct-del">Delete account</button></div>'+(acctMsg?'<p class="sub" style="margin:10px 0 0">'+esc(acctMsg)+'</p>':'')+f+'</section>';
}
document.addEventListener('submit',function(e){
  var fm=e.target.closest&&e.target.closest('form[data-acct]');if(!fm)return;e.preventDefault();
  var kind=fm.dataset.acct,old=$('#ac-old').value;
  deriveKeys(AUTH.email,old).then(function(cur){
    if(kind==='del')return api('DELETE','/api/account',{auth:cur.auth}).then(function(r){if(!r.ok){acctMsg=r.error;render();return}wipeLocal();location.reload()});

    return deriveKeys(AUTH.email,np).then(function(nw){
      return sealJson(nw.key,S).then(function(data){return api('POST','/api/password',{auth:cur.auth,newAuth:nw.auth,baseVersion:AUTH.version,data:data})}).then(function(r){
        if(r.ok){AUTH.key=nw.key;AUTH.version=r.version;AUTH.dirty=false;acctMode='';acctMsg='Password changed. Other devices were signed out.'}
        else acctMsg=r.conflict?'Your data changed on another device. Resolve that first, then try again.':r.error;
        render();
      });
    });
  }).catch(function(){acctMsg='Something went wrong.';render()});
});
document.addEventListener('visibilitychange',function(){if(!document.hidden)pullIfNewer()});
function bootHosted(){
  var done=false;
  function local(){if(done)return;done=true;load();render();widgetInit()}
  if(window.tally||!/^https?:$/.test(location.protocol))return local();
  fetch('/api/health',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null}).then(function(j){
    if(!j||!j.hosted)return local();
    done=true;HOSTED=true;
    S=sample();migrate();syncCats();            // placeholder behind the sign-in screen; real data is loaded after sign-in
    api('GET','/api/session').then(function(r){if(r.ok){AUTH.email=r.email;showGate('unlock')}else showGate('signin')},function(){showGate('signin','Cannot reach the server.')});
  }).catch(local);
}
bootHosted();
})();
