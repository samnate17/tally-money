<style>
body{margin:0}
/* Layout: left rail nav on desktop, bottom tab bar on phones; one content column of panels. */
:root{
  --bg:#eceff5; --surface:#ffffff; --surface2:#f4f6fb; --line:#dde2ee;
  --ink:#141b34; --muted:#5d6682; --accent:#3b4cf0; --accent-ink:#ffffff; --accent-soft:#e6e9ff;
  --good:#0b8f63; --warn:#b86a00; --bad:#d3302f; --good-soft:#dff5ec; --warn-soft:#fdf0d8; --bad-soft:#fde4e3;
  --c1:#3b4cf0; --c2:#16a085; --c3:#e8833a; --c4:#c2399a; --c5:#2e9fd8; --c6:#8a63d2; --c7:#d9a520; --c8:#7a8aa0;
  --font-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1222; --surface:#171c33; --surface2:#1e2440; --line:#2b3254;
  --ink:#eef0fa; --muted:#98a1c4; --accent:#7c8bff; --accent-ink:#0e1222; --accent-soft:#252d5c;
  --good:#3fd09c; --warn:#f0b04c; --bad:#ff7a76; --good-soft:#143a31; --warn-soft:#3d3015; --bad-soft:#442022;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1222; --surface:#171c33; --surface2:#1e2440; --line:#2b3254;
  --ink:#eef0fa; --muted:#98a1c4; --accent:#7c8bff; --accent-ink:#0e1222; --accent-soft:#252d5c;
  --good:#3fd09c; --warn:#f0b04c; --bad:#ff7a76; --good-soft:#143a31; --warn-soft:#3d3015; --bad-soft:#442022;
  color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:16px 96px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;display:flex;flex-direction:column;gap:4px;padding-top:8px}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;padding:4px 12px 16px;display:flex;align-items:center;gap:8px}
.brand svg{width:24px;height:24px;flex:none;border-radius:7px;box-shadow:0 0 12px rgba(59,76,240,.45)}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500}
.nav:hover{background:var(--surface)}
.nav[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.nav svg{width:20px;height:20px;flex:none}
.railfoot{margin-top:16px;padding:0 12px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:8px}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:30px}
.top .refresh{margin-right:auto}
.dashtiles .tile .v{font-size:34px}
:fullscreen .rail,:fullscreen .tabbar{display:none}
:fullscreen .app{max-width:1500px;grid-template-columns:minmax(0,1fr)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{min-width:128px;text-align:center;font-family:var(--font-display)}
.setsec{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 2px 8px}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.gate .card{width:100%;max-width:420px;margin-top:6vh;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.gate h1{font-size:26px;margin:0 0 4px}
.gate label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.gate input[type=email],.gate input[type=password],.gate input[type=text]{width:100%}
.gate .err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:9px 12px;margin-top:12px;font-size:14px}
.gate .ack{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:13px;color:var(--muted)}
.gate .row2{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--accent);padding:0;font:inherit;cursor:pointer;text-decoration:underline}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner span{min-width:0;flex:1 1 260px}
.grid{display:grid;gap:16px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.panel h2{font-size:17px;margin-bottom:12px}
.panel h2 small{font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tile .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:2px}
.tile .s{font-size:13px;color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#fff}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700}
.pill.good{background:var(--good-soft)} .pill.warn{background:var(--warn-soft)} .pill.bad{background:var(--bad-soft)} .pill.mute{background:var(--surface2);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--bad)} .bar>i.good{background:var(--good)}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;gap:6px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.legend span.v{margin-left:auto}
svg text{fill:var(--muted);font-family:var(--font-body)}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input,select{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0;max-width:100%}
input[type=number]{width:110px}
.search{flex:1 1 180px}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tabbar{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:30;max-width:90vw}
.amt{font-weight:700;white-space:nowrap}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
  .tabbar .nav{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;align-items:center;text-align:center}
  .tabbar .nav[aria-current="page"]{box-shadow:none;background:var(--accent-soft);color:var(--accent)}
  .top h1{font-size:25px}
  .hide-s{display:none}
}
.pdfpre{max-height:220px;overflow:auto;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;line-height:1.4;white-space:pre-wrap;word-break:break-word;margin:8px 0}
.maptable{border-collapse:collapse;font-size:12px}.maptable td,.maptable th{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;font-weight:400}.maptable select{font-size:12px;padding:3px 6px;min-width:112px}
.pdfscroll{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:2px 12px}
.pdfrow{gap:8px}.pdfrow input[type=text]{min-width:0}.pdfrow select{max-width:130px}
.balform{display:flex;gap:6px;align-items:center}
.balform input{width:120px}
.row.wrap{flex-wrap:wrap}
.tabbar{overflow-x:auto}.tabbar .nav{flex:1 0 auto;min-width:62px;font-size:10px}
.tabbar .nav span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s ease}}

/* ---------- Appearance (in Settings): theme variables, aurora backdrop, liquid glass ---------- */
:root{--radius:16px;--glass-pct:62%;--glass-blur:24px;--glow:rgba(59,76,240,.45);--mesh1:#7a86ff;--mesh2:#c58bff;--mesh3:#4fd6ee;--fs:15px;
  --edge:rgba(255,255,255,.62);--edge-soft:rgba(255,255,255,.34);--shade:rgba(20,27,52,.22)}
:root[data-theme="dark"]{--edge:rgba(255,255,255,.26);--edge-soft:rgba(255,255,255,.10);--shade:rgba(0,0,0,.5)}
body{font-size:var(--fs);position:relative;isolation:isolate}
#aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#aurora i{position:absolute;border-radius:50%;filter:blur(72px);opacity:.58;will-change:transform}
#aurora i:nth-child(1){width:56vmax;height:56vmax;left:-14vmax;top:-20vmax;background:var(--mesh1)}
#aurora i:nth-child(2){width:48vmax;height:48vmax;right:-14vmax;top:6vmax;background:var(--mesh2)}
#aurora i:nth-child(3){width:52vmax;height:52vmax;left:16vmax;bottom:-28vmax;background:var(--mesh3)}
:root[data-theme="dark"] #aurora i{opacity:.42}
:root[data-bg="plain"] #aurora{display:none}
:root[data-bg="soft"] #aurora i{opacity:.34}
:root[data-theme="dark"][data-bg="soft"] #aurora i{opacity:.24}
@keyframes drift1{to{transform:translate(10vmax,7vmax) scale(1.14)}}
@keyframes drift2{to{transform:translate(-9vmax,8vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(7vmax,-9vmax) scale(1.1)}}
:root[data-motion="full"][data-bg="aurora"] #aurora i:nth-child(1){animation:drift1 24s ease-in-out infinite alternate}
:root[data-motion="full"][data-bg="aurora"] #aurora i:nth-child(2){animation:drift2 29s ease-in-out infinite alternate}
:root[data-motion="full"][data-bg="aurora"] #aurora i:nth-child(3){animation:drift3 33s ease-in-out infinite alternate}
.panel,.tile,.rail,.tabbar,.gate .card,.banner,.toast{
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,calc(.30*var(--sh,0))),transparent 62%),
    linear-gradient(140deg,rgba(255,255,255,.26),rgba(255,255,255,0) 42%),
    color-mix(in srgb,var(--surface) var(--glass-pct),transparent);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.8) brightness(1.04);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.8) brightness(1.04);
  border:1px solid var(--edge-soft);
  box-shadow:inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge-soft),inset 1px 0 0 var(--edge-soft),0 14px 34px -16px var(--shade);
}
:root[data-theme="dark"] .panel,:root[data-theme="dark"] .tile,:root[data-theme="dark"] .rail,:root[data-theme="dark"] .tabbar,:root[data-theme="dark"] .gate .card,:root[data-theme="dark"] .banner{
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,calc(.14*var(--sh,0))),transparent 62%),
    linear-gradient(140deg,rgba(255,255,255,.09),rgba(255,255,255,0) 42%),
    color-mix(in srgb,var(--surface) var(--glass-pct),transparent)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.panel,.tile,.rail,.tabbar,.gate .card,.banner,.toast{background:var(--surface)}}
.panel{border-radius:var(--radius)}
.tile{border-radius:calc(var(--radius) - 2px)}
.panel,.tile{transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s}
.panel:hover,.tile:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge-soft),inset 1px 0 0 var(--edge-soft),0 20px 40px -16px var(--shade)}
.banner{border-radius:calc(var(--radius) - 2px);background-color:transparent;background-image:linear-gradient(0deg,color-mix(in srgb,var(--accent) 16%,transparent),color-mix(in srgb,var(--accent) 16%,transparent)),linear-gradient(140deg,rgba(255,255,255,.3),rgba(255,255,255,0) 50%)}
.rail{top:16px;padding:12px 10px;border-radius:calc(var(--radius) + 8px);max-height:calc(100vh - 32px);overflow:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.brand svg{box-shadow:0 0 14px var(--glow)}
.nav{border-radius:calc(var(--radius) * .72);transition:background .2s,color .2s,transform .2s}
.nav:hover{background:color-mix(in srgb,#fff 28%,transparent);transform:translateX(2px)}
:root[data-theme="dark"] .nav:hover{background:color-mix(in srgb,#fff 10%,transparent)}
.nav[aria-current="page"]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 24%,transparent),color-mix(in srgb,var(--accent) 12%,transparent));color:var(--ink);box-shadow:inset 0 1px 0 var(--edge),0 0 0 1px color-mix(in srgb,var(--accent) 38%,transparent),0 6px 18px -8px var(--glow)}
.nav[aria-current="page"] svg{color:var(--accent)}
.btn{border-radius:calc(var(--radius) * .72);background:color-mix(in srgb,var(--surface) 58%,transparent);-webkit-backdrop-filter:blur(12px) saturate(1.6);backdrop-filter:blur(12px) saturate(1.6);border:1px solid var(--edge-soft);box-shadow:inset 0 1px 0 var(--edge);transition:transform .15s,box-shadow .2s,border-color .2s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 78%,#fff),var(--accent));border-color:color-mix(in srgb,var(--accent) 70%,#000);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 20px -8px var(--glow)}
input,select{border-radius:calc(var(--radius) * .6);background:color-mix(in srgb,var(--surface2) 62%,transparent);border-color:var(--edge-soft);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
input[type=range]{padding:0;width:100%;accent-color:var(--accent);background:none;border:0}
input[type=color]{width:46px;height:38px;padding:2px;cursor:pointer}
.bar{background:color-mix(in srgb,var(--ink) 10%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.bar>i{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));box-shadow:0 0 10px var(--glow)}
.bar>i.warn{background:var(--warn);box-shadow:none}.bar>i.bad{background:var(--bad);box-shadow:none}.bar>i.good{background:var(--good);box-shadow:none}
.pill{backdrop-filter:blur(6px)}
.toast{background:color-mix(in srgb,var(--ink) 86%,transparent);color:var(--bg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:999px;padding:11px 20px}
.gate{background:color-mix(in srgb,var(--bg) 62%,transparent);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5)}
.gate .card{border-radius:calc(var(--radius) + 8px)}
.tile .v{background:linear-gradient(180deg,var(--ink),color-mix(in srgb,var(--ink) 72%,var(--accent)));-webkit-background-clip:text;background-clip:text}
.tile .v:not(:has(span)){-webkit-text-fill-color:transparent}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:6px 13px;color:var(--muted);font-weight:500;transition:background .2s,color .2s,box-shadow .2s}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 0 1px 0 var(--edge),0 2px 8px -2px var(--shade)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.sw{border:1px solid var(--edge-soft);background:color-mix(in srgb,var(--surface) 50%,transparent);border-radius:calc(var(--radius) * .8);padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;transition:transform .2s,box-shadow .2s}
.sw::before{content:'';width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--sw) 55%,#fff),var(--sw) 62%);box-shadow:0 6px 14px -4px var(--sw),inset 0 1px 0 rgba(255,255,255,.7)}
.sw:hover{transform:translateY(-3px) scale(1.03)}
.sw.on{box-shadow:0 0 0 2px var(--accent),0 10px 22px -10px var(--glow)}
.lookrow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--edge-soft)}
.lookrow:first-of-type{border-top:0}
.lookrow>label,.lookrow>.lbl{font-weight:600;min-width:140px}
.lookrow .ctl{flex:1 1 200px;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.lookrow .ctl input[type=range]{max-width:260px}
.lookrow small{display:block;font-weight:400;color:var(--muted);font-size:12px}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
@keyframes ringfill{from{stroke-dashoffset:var(--circ)}}
@keyframes drawline{from{stroke-dashoffset:1000}}
@keyframes fadein{from{opacity:0}}
@keyframes pulsedot{0%,100%{r:5;opacity:1}50%{r:8;opacity:.45}}
.draw{stroke-dasharray:1000}
:root[data-motion="full"] .ring-fg{animation:ringfill 1.2s cubic-bezier(.2,.8,.2,1) .15s backwards}
:root[data-motion="full"] .draw{animation:drawline 1.6s cubic-bezier(.3,.7,.2,1) .2s backwards}
:root[data-motion="full"] .fade{animation:fadein 1.4s ease .5s backwards}
:root[data-motion="full"] .pulse{animation:pulsedot 2.4s ease-in-out infinite}
.vzgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;align-items:start;margin-bottom:6px}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%)}
.herorow{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-top:10px}
.herosec{display:flex;flex-direction:column;gap:2px}
.herobig{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.1}
.herochips{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.herochip{background:var(--surface2);border-radius:12px;padding:10px 12px}

// Net worth over the last `days` days, from the balance history of each account (the balance on or before each date; the earliest known balance before that).
function netWorthTrail(accounts,isDebtFn,today,days,steps){
  var out=[],i,d,t=function(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
  for(i=0;i<=steps;i++){
    d=new Date(today.getFullYear(),today.getMonth(),today.getDate()-Math.round(days*(steps-i)/steps));
    var ds=t(d),total=0;
    accounts.forEach(function(a){
      var h=(a.history||[]).filter(function(x){return x&&x.date&&isFinite(x.balance)}).sort(function(p,q){return p.date<q.date?-1:1}),b=null,j;
      for(j=0;j<h.length;j++){if(h[j].date<=ds)b=h[j].balance}
      if(b===null)b=h.length?h[0].balance:a.balance;
      if(i===steps)b=a.balance;                                           // today is the current balance
      total+=isDebtFn(a)?-b:b;
    });
    out.push(total);
  }
  return out;
}

function sparkPath(vals,W,H,pad){
  if(vals.length<2)return null;var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mx===mn){mx+=1;mn-=1}
  return vals.map(function(v,i){return (pad+i*(W-2*pad)/(vals.length-1)).toFixed(1)+','+(pad+(1-(v-mn)/(mx-mn))*(H-2*pad)).toFixed(1)}).join(' ');
}

function barChart(vals,labels,o){

function applySync(res,itemId){
  var out={newTx:0,updTx:0,delTx:0,newAcct:0,updAcct:0},tdy=iso(TODAY);
  if(!Array.isArray(S.plaidIgnored))S.plaidIgnored=[];
  (res.accounts||[]).forEach(function(a){
    if(S.plaidIgnored.indexOf(a.accountId)>-1)return;
    var ex=S.accounts.filter(function(x){return x.plaid&&x.plaid.accountId===a.accountId})[0];
    if(ex){
      ex.plaid.itemId=itemId;
      if(a.type==='credit'&&a.limit>0)ex.limit=a.limit;
      if(a.balance!==null&&a.balance!==ex.balance){
        ex.balance=a.balance;
        var h=ex.history.filter(function(x){return x.date===tdy})[0];
        if(h)h.balance=a.balance;else ex.history.push({date:tdy,balance:a.balance});
        ex.history.sort(function(p,q){return p.date<q.date?-1:1});out.updAcct++;
      }
    }else{
      var b=a.balance===null?0:a.balance;
      var na={id:uid(),name:a.name+(a.mask?' ••'+a.mask:''),type:a.type,balance:b,apr:0,minPay:0,history:[{date:tdy,balance:b}],plaid:{itemId:itemId,accountId:a.accountId}};if(a.type==='credit'&&a.limit>0)na.limit=a.limit;S.accounts.push(na);out.newAcct++;
    }
  });
  var byPid={};S.txns.forEach(function(x){if(x.plaidId)byPid[x.plaidId]=x});
  function category(t){
    if(t.amount>0)return /refund|return/i.test(t.name)?'Other':'Income';
    var g=guessCat(t.name);
    return g==='Subscriptions'?g:(t.catHint&&t.catHint!=='Income'?t.catHint:(g==='Income'?'Other':g));
  }
  function acctFor(t){var a=S.accounts.filter(function(y){return y.plaid&&y.plaid.accountId===t.accountId})[0];return a?a.id:''}
  function add(t){var x={id:uid(),plaidId:t.plaidId,date:t.date,name:t.name,amount:t.amount,cat:category(t)};var ai=acctFor(t);if(ai)x.acct=ai;var sb=guessSub(x.cat,x.name);if(sb)x.sub=sb;S.txns.push(x);byPid[t.plaidId]=x}
  (res.added||[]).forEach(function(t){
    var ex=byPid[t.plaidId];
    if(ex){ex.date=t.date;ex.name=t.name;ex.amount=t.amount;if(!ex.acct&&acctFor(t))ex.acct=acctFor(t);out.updTx++}else{add(t);out.newTx++}
  });
  (res.modified||[]).forEach(function(t){
    var ex=byPid[t.plaidId];
    if(ex){ex.date=t.date;ex.name=t.name;ex.amount=t.amount;if(!ex.acct&&acctFor(t))ex.acct=acctFor(t);out.updTx++}else{add(t);out.newTx++}
  });
  var rm={};(res.removed||[]).forEach(function(id){rm[id]=1});
  var before=S.txns.length;
  S.txns=S.txns.filter(function(x){return !(x.plaidId&&rm[x.plaidId])});
  out.delTx=before-S.txns.length;if(typeof undoInit==='function')undoInit();   // a bank sync cannot be undone: the bank would not send those transactions again
  S.txns.sort(function(a,b){return a.date<b.date?1:-1});
  return out;
}
function aiKey(n){return normName(n)||'(blank)'}

function buildAiPayload(){
  var cut=iso(addDays(TODAY,-365)),groups={},n=0,first='',last='';
  S.txns.forEach(function(x){
    if(x.date<cut)return;
    n++;if(!first||x.date<first)first=x.date;if(!last||x.date>last)last=x.date;
    var k=aiKey(x.name),g=groups[k]||(groups[k]={key:k,name:x.name,count:0,total:0,rows:[],ld:''});
    g.count++;g.total+=x.amount;g.rows.push([x.date,Math.round(x.amount*100)/100]);
    if(x.date>=g.ld){g.ld=x.date;g.name=x.name}
  });
  var all=Object.keys(groups).map(function(k){return groups[k]}).sort(function(a,b){return Math.abs(b.total)-Math.abs(a.total)});
  var keep=all.slice(0,400).map(function(g){
    g.rows.sort(function(a,b){return a[0]<b[0]?-1:1});var r=g.rows.slice(-14);
    return {key:g.key,name:maskName(g.name),count:g.count,total:Math.round(g.total*100)/100,dates:r.map(function(x){return x[0]}),amounts:r.map(function(x){return x[1]})};

}

function aiProposals(res){
  var byKey={},changes=[],touched={};
  res.merchants.forEach(function(m){byKey[m.key]=m});
  S.txns.forEach(function(x){
    var m=byKey[aiKey(x.name)];if(!m)return;
    var want=null;
    if(x.amount>0){if(m.category==='Income')want='Income'}else if(m.category!=='Income')want=m.category;
    if(want&&want!==x.cat){changes.push({id:x.id,to:want});touched[m.key]=1}
  });
  var known=S.subs.map(function(s){return normName(s.name)}),subs=[],ended=[];
  res.merchants.forEach(function(m){

    var item={key:m.key,name:l.name,amount:Math.round(-l.amount*100)/100,cycle:m.subscription,next:iso(nx),confidence:m.confidence,reason:m.reason,count:ch.length,lastDate:l.date};

  return {changes:changes,merchantsChanged:Object.keys(touched).length,subs:subs,ended:ended,insights:res.insights};
}

/* CSV statements: delimiter, header row, column roles, dates and amounts are all detected; nothing assumes one bank's layout. */
var MONTHRE='(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?';
var MONIDX={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function csvScan(t,delim){
  var rows=[],r=[],f='',q=false,i,c;
  if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
  for(i=0;i<t.length;i++){c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===delim){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.length>1||r[0].trim()!=='')rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);if(r.length>1||r[0].trim()!=='')rows.push(r)}
  return rows;
}
function csvDelim(text){
  var best=',',bestScore=-1,sample=text.slice(0,6000);
  [',',';','\t','|'].forEach(function(d){
    var rows=csvScan(sample,d).slice(0,30),freq={};
    rows.forEach(function(r){freq[r.length]=(freq[r.length]||0)+1});
    var mode=0,mf=0;Object.keys(freq).forEach(function(k){if(freq[k]>mf||(freq[k]===mf&&+k>mode)){mf=freq[k];mode=+k}});
    var score=mode>1?mf*(mode-1):0;
    if(score>bestScore){bestScore=score;best=d}
  });
  return best;
}
function csvDate(str,order){
  var s=String(str||'').replace(/^["'\s]+|["'\s]+$/g,''),m,y,mo,d;
  if(!s)return null;
  if((m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[T\s].*)?$/.exec(s))){y=+m[1];mo=+m[2];d=+m[3]}
  else if((m=/^(\d{4})(\d{2})(\d{2})$/.exec(s))){y=+m[1];mo=+m[2];d=+m[3]}
  else if((m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})(?:[T\s].*)?$/.exec(s))){var a=+m[1],b=+m[2];y=+m[3];if(y<100)y+=2000;if(order==='dmy'){d=a;mo=b}else{mo=a;d=b}}
  else if((m=new RegExp('^'+MONTHRE+'\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s+(\\d{4}|\\d{2})$','i').exec(s))){mo=MONIDX[m[1].toLowerCase()];d=+m[2];y=+m[3];if(y<100)y+=2000}
  else if((m=new RegExp('^(\\d{1,2})(?:st|nd|rd|th)?[\\s\\-\\/]+'+MONTHRE+'[\\s,\\-\\/]+(\\d{4}|\\d{2})$','i').exec(s))){d=+m[1];mo=MONIDX[m[2].toLowerCase()];y=+m[3];if(y<100)y+=2000}
  else return null;

function csvOrder(values){

function csvAmount(str){
  var s=String(str===undefined||str===null?'':str).replace(/[−‒-―]/g,'-').trim();
  if(!s)return null;
  var neg=false,cr=false,dr=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  if(/(\s|\d)(CR|DR)\.?$/i.test(s)){if(/CR\.?$/i.test(s))cr=true;else dr=true;s=s.replace(/\s*(CR|DR)\.?$/i,'')}
  s=s.replace(/\b(USD|EUR|GBP|CAD|AUD|CHF)\b/gi,'').replace(/[\u20ac\u00a3$\u00a5\s]/g,''); // only currency marks are ignored, so text like "CHECK 1042" is not an amount

  var lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');

  var v=parseFloat(s);if(isNaN(v))return null;

}
var CSV_ROLES=['date','desc','amount','debit','credit','type','cat'];
function csvRoles(cells){
  var map={date:-1,desc:-1,amount:-1,debit:-1,credit:-1,type:-1,cat:-1},rank={date:99,desc:99};
  var dateOrder=['transaction date','trans date','txn date','date','posting date','posted date','post date','booking date','value date'];
  var descOrder=['description','desc','narrative','narration','payee','merchant','name','details','detail','particulars','memo','reference','text','transaction','counterparty','beneficiary','note'];
  cells.forEach(function(raw,j){
    var c=String(raw||'').toLowerCase().replace(/[^a-z0-9\/ ]+/g,' ').replace(/\s+/g,' ').trim();
    if(!c)return;

function csvRolesOk(m){return m.date>-1&&m.desc>-1&&(m.amount>-1||m.debit>-1||m.credit>-1)}
function csvInfer(rows){

function csvBuild(rows,headerIdx,map,opts){

function cleanPayUrl(t){
  t=String(t||'').trim();if(!t||t.length>300||/\s/.test(t))return '';
  if(!/^[a-z][a-z0-9+.-]*:/i.test(t))t='https://'+t;
  var u;try{u=new URL(t)}catch(e){return ''}
  if(u.protocol!=='https:'||u.username||u.password)return '';
  if(!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(u.hostname)||/^\d+(\.\d+){3}$/.test(u.hostname))return '';
  return u.href;
}
function payHost(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}}
function cleanPayLinks(o){
  var out={},n=0;if(!o||typeof o!=='object'||Array.isArray(o))return out;
  Object.keys(o).forEach(function(k){if(n>=200||!/^(home|bill:[\w.-]{1,60}|loan:[\w.-]{1,60}|loan:grp:[^\n\r]{1,120})$/.test(k))return;var u=cleanPayUrl(o[k]);if(u){out[k]=u;n++}});
  return out;
}

/*DEBTPLAN-START*/
// Paying several debts with one monthly amount. Minimums always come first; whatever is left goes to the debt the strategy picks.
//   avalanche: highest interest rate first (the least interest)   snowball: smallest balance first (fewest debts, soonest)   minimum: minimums only
function payoffPlan(debts,monthly,strategy,opt){
  opt=opt||{};
  var ds=debts.filter(function(d){return d.balance>0.005}).map(function(d){return {id:d.id,name:d.name,bal:d.balance,apr:d.apr||0,min:Math.max(0,d.minPay||0),paid:0,interest:0,start:d.balance}});
  var minTotal=ds.reduce(function(a,d){return a+d.min},0);
  if(!ds.length)return {ok:true,months:0,interest:0,paidTotal:0,sched:[0],left:[0],order:[],minTotal:0,budget:0};
  var budget=strategy==='minimum'?minTotal:(+monthly||0);
  if(strategy!=='minimum'&&budget<minTotal-0.005)return {ok:false,reason:'below',minTotal:minTotal};
  if(!(budget>0))return {ok:false,reason:'nopay',minTotal:minTotal};
  var pick=function(a,b){return strategy==='snowball'?(a.bal-b.bal||b.apr-a.apr):(b.apr-a.apr||a.bal-b.bal)};
  var lump=Math.max(0,+opt.lump||0);
  ds.slice().sort(pick).forEach(function(d){var t=Math.min(d.bal,lump);d.bal-=t;lump-=t});
  var open=function(){return ds.filter(function(d){return d.bal>0.005}).length};
  var total=function(){return ds.reduce(function(a,d){return a+Math.max(0,d.bal)},0)};
  var sched=[total()],left=[open()],m=0,interest=0,paidTotal=0;
  ds.forEach(function(d){if(d.bal<=0.005&&!d.paid)d.paid=0.0001});
  while(open()&&m<1200){
    m++;
    ds.forEach(function(d){if(d.bal>0.005){var i=d.bal*d.apr/1200;d.bal+=i;d.interest+=i;interest+=i}});
    var avail=budget;
    ds.forEach(function(d){if(d.bal>0.005){var p=Math.min(d.min,d.bal,avail);d.bal-=p;avail-=p;paidTotal+=p}});
    ds.slice().sort(pick).forEach(function(d){if(d.bal>0.005&&avail>0){var p=Math.min(d.bal,avail);d.bal-=p;avail-=p;paidTotal+=p}});
    ds.forEach(function(d){if(d.bal<=0.005&&!d.paid)d.paid=m});
    sched.push(Math.max(0,total()));left.push(open());
  }
  if(open())return {ok:false,reason:'never',minTotal:minTotal};

function drawGate(){
  var el=$('#gate');if(!gate){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='gate';el.className='gate';document.body.appendChild(el)}
  var g=gate,m=g.mode,h='<div class="card"><h1>Tally Money</h1>';
  var err=g.msg?'<div class="err" role="alert">'+esc(g.msg)+'</div>':'';
  if(m==='unlock'){
    h+='<p class="sub muted">Signed in as <b>'+esc(AUTH.email)+'</b>. Enter your password to unlock your data.</p><form id="gf" data-m="unlock"><label for="g-pw">Password</label><input id="g-pw" type="password" autocomplete="current-password" required autofocus>'+err+'<div class="row2"><button class="btn primary" type="submit"'+(g.busy?' disabled':'')+'>'+(g.busy?'Unlocking…':'Unlock')+'</button><button class="linkbtn" type="button" data-g="out">Sign out</button></div></form>';
  }else if(m==='register'){
    h+='<p class="sub muted">Creating an account needs an invite code from the person who runs this site.</p><form id="gf" data-m="register"><label for="g-em">Email</label><input id="g-em" type="email" autocomplete="username" required><label for="g-inv">Invite code</label><input id="g-inv" type="text" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX" required><label for="g-pw">Password (10+ characters)</label><input id="g-pw" type="password" autocomplete="new-password" required><label for="g-pw2">Repeat password</label><input id="g-pw2" type="password" autocomplete="new-password" required><label class="ack"><input id="g-ack" type="checkbox"><span>I understand that my data is encrypted with my password. If I forget it, nobody can recover it. I will download backups.</span></label>'+err+'<div class="row2"><button class="btn primary" type="submit"'+(g.busy?' disabled':'')+'>'+(g.busy?'Creating…':'Create account')+'</button><button class="linkbtn" type="button" data-g="signin">I already have an account</button></div></form>';
  }else{
    h+='<p class="sub muted">Sign in to open your data.</p><form id="gf" data-m="signin"><label for="g-em">Email</label><input id="g-em" type="email" autocomplete="username" required autofocus><label for="g-pw">Password</label><input id="g-pw" type="password" autocomplete="current-password" required>'+err+'<div class="row2"><button class="btn primary" type="submit"'+(g.busy?' disabled':'')+'>'+(g.busy?'Signing in…':'Sign in')+'</button><button class="linkbtn" type="button" data-g="register">Have an invite code?</button></div></form>';
  }
  el.innerHTML=h+'</div>';
  var f=$('#gf',el);if(f)f.onsubmit=function(e){e.preventDefault();gateSubmit(f.dataset.m)};
  el.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){var a=b.dataset.g;if(a==='out')signOut();else showGate(a)}});
  var first=$('input',el);if(first&&!g.busy)first.focus();
}
function gateFail(msg){gate.busy=false;gate.msg=msg;var v=function(id){var x=$(id);return x?x.value:''};var keep={em:v('#g-em'),inv:v('#g-inv'),ack:!!($('#g-ack')&&$('#g-ack').checked)};drawGate();if(keep.em&&$('#g-em'))$('#g-em').value=keep.em;if(keep.inv&&$('#g-inv'))$('#g-inv').value=keep.inv;if(keep.ack&&$('#g-ack'))$('#g-ack').checked=true}
function gateSubmit(mode){
  var em=mode==='unlock'?AUTH.email:($('#g-em').value||'').trim().toLowerCase(),pw=$('#g-pw').value;
  if(mode==='register'){
    var inv=$('#g-inv').value,bad=passwordProblem(pw,em);
    if(bad)return gateFail(bad);
    if(pw!==$('#g-pw2').value)return gateFail('The two passwords do not match.');
    if(!$('#g-ack').checked)return gateFail('Please tick the box to confirm you understand.');
  }
  gate.busy=true;gate.msg='';var eb=$('#gf button[type=submit]'),ee=$('#gate .err');if(eb){eb.disabled=true;eb.textContent='Working…'}if(ee)ee.remove();
  deriveKeys(em,pw).then(function(k){
    if(mode==='unlock')return afterAuth(em,k.key);
    var body=mode==='register'?{email:em,auth:k.auth,invite:inv}:{email:em,auth:k.auth};
    return api('POST',mode==='register'?'/api/register':'/api/login',body).then(function(r){
      if(!r.ok)return gateFail(r.error||'Something went wrong.');
      return afterAuth(r.email,k.key,mode==='register');
    });
  }).catch(function(er){gateFail(er&&er.message?er.message:'Something went wrong.')});
}
function afterAuth(email,key,isNew){
  AUTH.email=email;AUTH.key=key;
  return api('GET','/api/data').then(function(r){
    if(!r.ok){if(r.signedOut){AUTH.key=null;return showGate('signin','Your session ended. Please sign in again.')}return gateFail(r.error||'Could not load your data.')}
    AUTH.version=r.version;
    if(r.data){
      return openJson(key,r.data).then(function(obj){adopt(obj);ownerSet(email);finishGate()},function(er){AUTH.key=null;gateFail(er.message)});
    }
    // Nothing stored yet for this account.
    var own=ownerGet(),local=null;try{local=JSON.parse(localStorage.getItem('tally-money-v1')||'null')}catch(e){}
    if(local&&own===email){S=local;migrate();syncCats()}
    else if(local&&!own&&!local.sample&&window.confirm('This browser already has Tally data that was saved before accounts. Add it to your new account?\n\nOK adds it. Cancel starts the account empty.')){S=local;migrate();syncCats()}
    else{wipeLocal();S=sample();migrate();syncCats()}
    ownerSet(email);
    finishGate();AUTH.dirty=true;push();
  }).catch(function(er){gateFail(er&&er.message?er.message:'Could not reach the server.')});
}
function finishGate(){gate=null;drawGate();AUTH.status='Synced';render()}
function signOut(){api('POST','/api/logout',{}).then(function(){wipeLocal();location.reload()},function(){wipeLocal();location.reload()})}
var pushT=0;
function schedulePush(){if(!HOSTED||!AUTH.key)return;AUTH.dirty=true;AUTH.status='Saving…';clearTimeout(pushT);pushT=setTimeout(push,1500)}
function push(){
  if(!HOSTED||!AUTH.key||!AUTH.dirty||AUTH.busy||AUTH.conflict)return;
  AUTH.busy=true;AUTH.dirty=false;
  var snap=S;
  return sealJson(AUTH.key,snap).then(function(data){return api('PUT','/api/data',{baseVersion:AUTH.version,data:data})}).then(function(r){
    AUTH.busy=false;
    if(r.ok){AUTH.version=r.version;AUTH.status='Synced '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
    else if(r.conflict){AUTH.conflict=true;AUTH.status='Changed on another device'}
    else if(r.signedOut){AUTH.key=null;showGate('unlock','Your session ended. Enter your password to continue.')}
    else{AUTH.dirty=true;AUTH.status='Not saved: '+(r.error||'error')+'. Will retry.';clearTimeout(pushT);pushT=setTimeout(push,30000)}
    if(AUTH.dirty&&!AUTH.conflict&&r.ok)push();
    syncUi();
  },function(){AUTH.busy=false;AUTH.dirty=true;AUTH.status='Offline. Will retry.';clearTimeout(pushT);pushT=setTimeout(push,30000);syncUi()});
}
function syncUi(){var el=$('#syncstat');if(el)el.textContent=AUTH.status;var b=$('#conflict');if(b)b.hidden=!AUTH.conflict;else if(AUTH.conflict)render()}
function pullIfNewer(){
  if(!HOSTED||!AUTH.key||AUTH.busy)return;
  api('GET','/api/data').then(function(r){
    if(!r.ok||r.version<=AUTH.version||!r.data)return;
    if(AUTH.dirty||AUTH.conflict){AUTH.conflict=true;AUTH.remote=r;syncUi();return}
    openJson(AUTH.key,r.data).then(function(obj){AUTH.version=r.version;adopt(obj);AUTH.status='Updated from another device';render()},function(){});
  },function(){});
}
function resolveConflict(useRemote){
  api('GET','/api/data').then(function(r){
    if(!r.ok)return;
    if(useRemote&&r.data){openJson(AUTH.key,r.data).then(function(obj){AUTH.version=r.version;AUTH.conflict=false;AUTH.dirty=false;adopt(obj);AUTH.status='Loaded the other version';render()})}
    else{AUTH.version=r.version;AUTH.conflict=false;AUTH.dirty=true;push()}
  });
}
function accountPanel(){
  if(!HOSTED)return '';
  var f=acctMode==='pw'?'<form data-acct="pw" class="form" style="margin-top:12px;flex-wrap:wrap"><input id="ac-old" type="password" placeholder="Current password" autocomplete="current-password" required><input id="ac-new" type="password" placeholder="New password (10+)" autocomplete="new-password" required><input id="ac-new2" type="password" placeholder="Repeat new password" autocomplete="new-password" required><button class="btn primary">Change password</button><button class="btn" type="button" data-act="acct-cancel">Cancel</button></form>'
   :acctMode==='del'?'<form data-acct="del" class="form" style="margin-top:12px;flex-wrap:wrap"><input id="ac-old" type="password" placeholder="Password to confirm" autocomplete="current-password" required><button class="btn danger">Delete my account and data</button><button class="btn" type="button" data-act="acct-cancel">Cancel</button></form><p class="sub muted" style="font-size:13px">This permanently removes your account and everything stored for it. It cannot be undone.</p>':'';
  return '<section class="panel"><h2>Account<small>'+esc(AUTH.email)+'</small></h2><p class="sub muted" style="margin:0 0 10px;font-size:13px">Your data is encrypted in this browser before it is saved to your account, so the site owner cannot read it. If you forget your password it cannot be recovered, so keep a backup. <span id="syncstat">'+esc(AUTH.status)+'</span></p><div class="actions" style="justify-content:flex-start"><button class="btn" data-act="acct-pw">Change password</button><button class="btn" data-act="acct-out">Sign out</button><button class="btn danger" data-act="acct-delete-me">Delete account</button></div>'+(acctMsg?'<p class="sub" style="margin:10px 0 0">'+esc(acctMsg)+'</p>':'')+f+'</section>';
}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='link'&&e.target.dataset.view){view=e.target.dataset.view;render();window.scrollTo(0,0)}});
document.addEventListener('submit',function(e){
  var fm=e.target.closest&&e.target.closest('form[data-acct]');if(!fm)return;e.preventDefault();
  var kind=fm.dataset.acct,old=$('#ac-old').value;
  deriveKeys(AUTH.email,old).then(function(cur){
    if(kind==='del')return api('DELETE','/api/account',{auth:cur.auth}).then(function(r){if(!r.ok){acctMsg=r.error;render();return}wipeLocal();location.reload()});
    var np=$('#ac-new').value,bad=passwordProblem(np,AUTH.email);
    if(bad){acctMsg=bad;render();return}
    if(np!==$('#ac-new2').value){acctMsg='The new passwords do not match.';render();return}
    return deriveKeys(AUTH.email,np).then(function(nw){
      return sealJson(nw.key,S).then(function(data){return api('POST','/api/password',{auth:cur.auth,newAuth:nw.auth,baseVersion:AUTH.version,data:data})}).then(function(r){
        if(r.ok){AUTH.key=nw.key;AUTH.version=r.version;AUTH.dirty=false;acctMode='';acctMsg='Password changed. Other devices were signed out.'}
        else acctMsg=r.conflict?'Your data changed on another device. Resolve that first, then try again.':r.error;
        render();
      });
    });
  }).catch(function(){acctMsg='Something went wrong.';render()});
});
document.addEventListener('visibilitychange',function(){if(!document.hidden)pullIfNewer()});
document.addEventListener('keydown',function(e){
  if(!(e.metaKey||e.ctrlKey)||e.altKey||VLT.locked)return;
  var k=(e.key||'').toLowerCase(),t=e.target,tag=t&&t.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;   // inside a box, Ctrl/Cmd+Z undoes typing as usual
  if(k==='z'&&!e.shiftKey){e.preventDefault();undoStep('undo')}
  else if((k==='z'&&e.shiftKey)||k==='y'){e.preventDefault();undoStep('redo')}
});
function bootHosted(){
  var done=false;
  function local(){if(done)return;done=true;load();if(VLT.locked){showLock();bioLoad(function(){if(BIO.enabled){showLock();bioUnlock()}});return}render();widgetInit()}
  if(window.tally||!/^https?:$/.test(location.protocol))return local();
  fetch('/api/health',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null}).then(function(j){
    if(!j||!j.hosted)return local();
    done=true;HOSTED=true;
    S=sample();migrate();syncCats();            // placeholder behind the sign-in screen; real data is loaded after sign-in
    api('GET','/api/session').then(function(r){if(r.ok){AUTH.email=r.email;showGate('unlock')}else showGate('signin')},function(){showGate('signin','Cannot reach the server.')});
  }).catch(local);
}
bootHosted();
})();
</script>
